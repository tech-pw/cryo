[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryo-iceberg-compactor"
version = "0.1.0"
description = "Cryo backend for Apache Iceberg maintenance and health."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "boto3>=1.34.0,<2",
    "cryptography>=42.0.0",
    "fastapi",
    "httpx",
    "prometheus-client",
    "psycopg[binary]",
    "pydantic-settings",
    "pyarrow>=17.0.0",
    "pyiceberg[hive,s3fs,pyarrow]>=0.11.0,<0.11.99",
    "pyjwt>=2.8.0",
    "redis",
    "sqlalchemy[asyncio]",
    "trino",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
cryo = "cryo.cli:main"

[tool.setuptools.packages.find]
include = ["cryo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
