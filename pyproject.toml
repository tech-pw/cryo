[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryo-iceberg-compactor"
version = "0.1.0"
description = "Cryo backend for Apache Iceberg maintenance and health."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "tech-pw" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "alembic",
    "boto3>=1.34.0,<2",
    "cryptography>=50.0.0",
    "fastapi",
    "httpx",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-sdk>=1.27.0",
    "pgvector>=0.3.0",
    "prometheus-client",
    "psycopg[binary]",
    "pydantic-settings",
    "pyarrow>=23.0.1",
    "pyiceberg[hive,s3fs,pyarrow]>=0.11.0,<0.11.99",
    "pyjwt>=2.15.0",
    "redis",
    "sqlalchemy[asyncio]",
    "sqlglot>=25.0.0",
    "structlog>=24.0.0",
    "kubernetes>=30.0.0,<31",
    "trino",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    # Real Redis Streams semantics (PEL, XAUTOCLAIM, XINFO) for the queue tests. Hand-rolled
    # doubles cannot model consumer-group redelivery, which is the behaviour under test.
    "fakeredis>=2.26",
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://tech-pw.github.io/cryo"
Repository = "https://github.com/tech-pw/cryo"
Issues = "https://github.com/tech-pw/cryo/issues"
Changelog = "https://github.com/tech-pw/cryo/blob/main/CHANGELOG.md"

[project.scripts]
cryo = "cryo.cli:main"

[tool.setuptools.packages.find]
include = ["cryo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# The published benchmark harness is a frozen artifact: it is the code that
# produced the results, and reformatting it would break the protocol freeze.
# force-exclude applies it even when the path is passed explicitly.
force-exclude = true
extend-exclude = ["benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.bandit]
exclude_dirs = ["engine-go/third_party", "web", "site", ".venv"]

# pytest asserts are the test framework, not a security control. cryo/ is still checked.
[tool.bandit.assert_used]
skips = ["tests/*", "*/tests/*", "*/test_*.py", "*_test.py"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
