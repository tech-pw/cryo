[package]
name = "cryo-engine"
version = "0.1.0"
edition = "2021"
description = "Native Rust execution engine for Cryo Iceberg maintenance"
license = "Apache-2.0"

[[bin]]
name = "cryo-engine"
path = "src/main.rs"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Pin to a specific upstream commit for reproducible builds (ExpireSnapshotsAction + table props).
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "6144e10bfdc93e4c4efd4f81147b612dc2b98678" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust", rev = "6144e10bfdc93e4c4efd4f81147b612dc2b98678" }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust", rev = "6144e10bfdc93e4c4efd4f81147b612dc2b98678", features = ["opendal-s3"] }

# Arrow/Parquet — align with iceberg's parquet 58.x for staged compaction writes
arrow = { version = "58", default-features = false, features = ["ipc"] }
parquet = { version = "58", default-features = false, features = ["arrow"] }
bytes = "1"

# Object storage
object_store = { version = "0.11", features = ["aws"] }
futures = "0.3"
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 0
