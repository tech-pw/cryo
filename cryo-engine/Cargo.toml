[package]
name = "cryo-engine"
version = "0.1.0"
edition = "2021"
description = "Native Rust execution engine for Cryo Iceberg maintenance"
license = "Apache-2.0"

[[bin]]
name = "cryo-engine"
path = "src/main.rs"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Pin to the first upstream commit that uses Parquet 59, which dropped the thrift crate.
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "665c64e4" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust", rev = "665c64e4" }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust", rev = "665c64e4", features = ["opendal-s3"] }

# Arrow/Parquet — align with that iceberg revision. Parquet 59 does not depend on thrift.
arrow = { version = "59", default-features = false, features = ["ipc"] }
parquet = { version = "59", default-features = false, features = ["arrow"] }
bytes = "1"

# Object storage
object_store = { version = "0.14", features = ["aws"] }
futures = "0.3"
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 0
