<svg class="maintenance-flow-svg is-wide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="maintenanceFlowTitle maintenanceFlowDesc">
  <title id="maintenanceFlowTitle">Cryo maintains one Iceberg table: scan, admit, rewrite, receipt</title>
  <desc id="maintenanceFlowDesc">The same Iceberg table is shown on both sides. On the left it is fragmented with many small files. Cryo scans stored stats, admits the rewrite when engines have headroom, then packs the files. On the right the same table holds a few right-sized files and an audit receipt.</desc>

