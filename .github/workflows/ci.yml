name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          ver="8.18.0"
          archive="gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSLO \
            "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/${archive}"
          echo "6e19050a3ee0688265ed3be4c46a0362487d20456ecd547e8c7328eaed3980cb  ${archive}" \
            | sha256sum --check --strict
          tar -xzf "${archive}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

  supply-chain:
    name: Image vulnerability scan & SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Verify production requirements export
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt \
            --output-file /tmp/requirements.lock
          diff --unified requirements.lock /tmp/requirements.lock

      - name: Build immutable CI image
        run: docker build --tag "cryo-ci:${GITHUB_SHA}" .

      - name: Block fixable critical/high image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "cryo-ci:${{ github.sha }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: "cryo-ci:${{ github.sha }}"
          format: spdx-json
          artifact-name: "cryo-${{ github.sha }}.spdx.json"
          output-file: "cryo-${{ github.sha }}.spdx.json"
          upload-artifact: true
          upload-artifact-retention: 30
          upload-release-assets: false

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check cryo tests

      - name: Run ruff format check
        run: ruff format --check cryo tests

      - name: Verify capability contract documentation
        run: python -m cryo.capabilities.generate_docs --check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy cryo

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cryo
          POSTGRES_PASSWORD: cryo
          POSTGRES_DB: cryo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Run database migrations
        env:
          CRYO_DATABASE_URL: postgresql+psycopg://cryo:cryo@localhost:5432/cryo_test
        run: alembic upgrade head

      - name: Run tests
        env:
          CRYO_DATABASE_URL: postgresql+psycopg://cryo:cryo@localhost:5432/cryo_test
          CRYO_REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --tb=short

  cryo-engine:
    name: cryo-engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cryo-engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: Verify cryo-engine spawnable from repo root
        working-directory: .
        run: |
          pip install -e ".[dev]"
          python - <<'PY'
          from cryo.engines.native.runner import resolve_binary_path, verify_cryo_engine_spawnable
          binary = resolve_binary_path({"binary_path": "cryo-engine/target/release/cryo-engine"})
          assert binary is not None, "release binary missing after cargo build"
          assert verify_cryo_engine_spawnable({"binary_path": binary}) is None
          PY

  cryo-engine-go:
    name: cryo-engine-go (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: engine-go/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: CGO_ENABLED=0 go test ./...

      - name: go build
        run: CGO_ENABLED=0 go build -o bin/cryo-engine-go ./cmd/cryo-engine-go

      - name: Verify cryo-engine-go spawnable from repo root
        working-directory: .
        run: |
          pip install -e ".[dev]"
          python - <<'PY'
          from cryo.engines.native.runner import resolve_binary_path, verify_cryo_engine_spawnable
          binary = resolve_binary_path({
              "binary_path": "engine-go/bin/cryo-engine-go",
              "engine_impl": "go",
          })
          assert binary is not None, "go binary missing after go build"
          assert verify_cryo_engine_spawnable({"binary_path": binary}) is None
          PY

  native-e2e:
    name: native-e2e (REST + MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - name: Start MinIO and Iceberg REST
        run: |
          docker compose -f docker-compose.dev-datalake.yml up -d minio minio-init iceberg-rest
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8181/v1/config >/dev/null; then
              echo "Iceberg REST is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Iceberg REST did not become ready in time" >&2
          exit 1

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Build cryo-engine
        working-directory: cryo-engine
        run: cargo build --release

      - name: Run native expire + orphan e2e
        env:
          CRYO_REST_URI: http://localhost:8181
          CRYO_ENGINE_BINARY: cryo-engine/target/release/cryo-engine
        run: pytest tests/integration/native/test_native_expire_orphan_e2e.py -v

  native-e2e-go:
    name: native-e2e-go (REST + MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: engine-go/go.sum

      - name: Start MinIO and Iceberg REST
        run: |
          docker compose -f docker-compose.dev-datalake.yml up -d minio minio-init iceberg-rest
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8181/v1/config >/dev/null; then
              echo "Iceberg REST is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Iceberg REST did not become ready in time" >&2
          exit 1

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Build cryo-engine-go
        working-directory: engine-go
        run: CGO_ENABLED=0 go build -o bin/cryo-engine-go ./cmd/cryo-engine-go

      - name: Run native expire + orphan e2e (Go engine)
        env:
          CRYO_REST_URI: http://localhost:8181
          CRYO_ENGINE_IMPL: go
          CRYO_ENGINE_BINARY: engine-go/bin/cryo-engine-go
        run: pytest tests/integration/native/test_native_expire_orphan_e2e.py -v

  native-compaction-e2e-go:
    name: native-compaction-e2e-go (REST + MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: engine-go/go.sum

      - name: Start MinIO, Iceberg REST, and Trino
        run: |
          docker compose -f docker-compose.dev-datalake.yml up -d minio minio-init iceberg-rest trino
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8181/v1/config >/dev/null; then
              echo "Iceberg REST is ready"
              break
            fi
            sleep 2
          done
          if ! curl -fsS http://localhost:8181/v1/config >/dev/null; then
            echo "Iceberg REST did not become ready in time" >&2
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/v1/info >/dev/null 2>&1; then
              echo "Trino is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Trino did not become ready in time" >&2
          exit 1

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Build cryo-engine-go
        working-directory: engine-go
        run: |
          CGO_ENABLED=0 go build -o bin/cryo-engine-go ./cmd/cryo-engine-go
          CGO_ENABLED=0 go build -o bin/seed-native-fixtures ./cmd/seed-native-fixtures

      - name: Seed compaction fixtures
        env:
          CRYO_REST_URI: http://localhost:8181
          CRYO_SEED_NATIVE_FIXTURES_BINARY: engine-go/bin/seed-native-fixtures
        run: python tests/integration/native/generate_compaction_fixtures.py

      - name: Run native COW + MOR compaction e2e (Go engine)
        env:
          CRYO_REST_URI: http://localhost:8181
          CRYO_ENGINE_IMPL: go
          CRYO_ENGINE_BINARY: engine-go/bin/cryo-engine-go
        run: pytest tests/integration/native/test_native_compaction_e2e.py tests/integration/native/test_native_mor_compaction_e2e.py tests/integration/native/test_native_mor_concurrency_e2e.py tests/integration/native/test_native_fault_injection_e2e.py tests/integration/native/test_native_checkpoint_resume_e2e.py -v

      - name: Run differential vs Trino e2e (Go engine)
        env:
          CRYO_REST_URI: http://localhost:8181
          CRYO_ENGINE_IMPL: go
          CRYO_ENGINE_BINARY: engine-go/bin/cryo-engine-go
          CRYO_TRINO_URI: http://localhost:8080
          CRYO_SEED_NATIVE_FIXTURES_BINARY: engine-go/bin/seed-native-fixtures
        run: pytest tests/integration/native/test_native_differential_e2e.py tests/integration/native/test_native_mor_differential_e2e.py -v
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Check CLI entry point
        run: |
          pip install dist/*.whl
          cryo --help

  web:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Enforce global CSS budget
        run: npm run check:styles-budget

      - name: Impeccable design-quality detector
        # Part 1I / Part 9.2 — `npx impeccable detect` blocks AI-slop, typography
        # drift, and design-system token violations. Exit 2 = findings to fix.
        # Detector is run from the repo root so .impeccable/config.json resolves.
        run: npm run impeccable:detect

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  web-e2e:
    name: Web E2E (critical path + axe-core WCAG gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cryo
          POSTGRES_PASSWORD: cryo
          POSTGRES_DB: cryo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CRYO_DATABASE_URL: postgresql+psycopg://cryo:cryo@localhost:5432/cryo_test
      CRYO_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend deps (for the API server the e2e hits)
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Install JS deps (incl. @axe-core/playwright)
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run DB migrations
        run: alembic upgrade head

      - name: Start API + Vite dev server
        run: |
          uvicorn cryo.api.app:create_app --factory --port 8000 --host 127.0.0.1 &
          API_PID=$!
          sleep 10
          echo "API_PID=$API_PID"
          # Wait for API to come up
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then
              echo "API is ready"
              break
            fi
            sleep 1
          done

      - name: Run critical-path + WCAG 2.2 AA gate (axe-core)
        run: |
          npx playwright test e2e/critical-path.spec.ts e2e/accessibility.spec.ts --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  web-visual:
    name: Web visual regression (Playwright snapshots)
    runs-on: ubuntu-latest
    needs: [web]
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cryo
          POSTGRES_PASSWORD: cryo
          POSTGRES_DB: cryo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CRYO_DATABASE_URL: postgresql+psycopg://cryo:cryo@localhost:5432/cryo_test
      CRYO_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend deps (for the API server the visual tests hit)
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Install JS deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run DB migrations
        run: alembic upgrade head

      - name: Start API + Vite dev server
        run: |
          uvicorn cryo.api.app:create_app --factory --port 8000 --host 127.0.0.1 &
          API_PID=$!
          sleep 10
          echo "API_PID=$API_PID"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then
              echo "API is ready"
              break
            fi
            sleep 1
          done

      - name: Run visual regression (login + authenticated routes)
        run: npm run test:visual

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
