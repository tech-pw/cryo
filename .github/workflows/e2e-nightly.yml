name: E2E Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        uses: ./.github/actions/python-deps

      - name: Start stack
        run: docker compose up -d postgres redis

      - name: Migrate and smoke test
        env:
          CRYO_DATABASE_URL: postgresql+psycopg://cryo:cryo@localhost:5432/cryo
          CRYO_REDIS_URL: redis://localhost:6379/0
        run: |
          alembic upgrade head
          pytest tests/test_health.py -v --tb=short

      - name: Tear down
        if: always()
        run: docker compose down -v

  playwright-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: compose-e2e
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
