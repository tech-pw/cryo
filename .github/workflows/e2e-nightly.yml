name: E2E Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  compose-e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Start stack
        run: docker compose up -d postgres redis

      - name: Migrate and smoke test
        env:
          CRYO_DATABASE_URL: postgresql+psycopg://cryo:cryo@localhost:5432/cryo
          CRYO_REDIS_URL: redis://localhost:6379/0
        run: |
          alembic upgrade head
          pytest tests/test_health.py -v --tb=short

      - name: Tear down
        if: always()
        run: docker compose down -v

  playwright-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: compose-e2e
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
