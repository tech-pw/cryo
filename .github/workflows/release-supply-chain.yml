name: Signed release image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-evidence:
    name: Build migration + release evidence
    runs-on: ubuntu-latest
    # requirements.lock is dependencies-only (--require-hashes can't cover an editable
    # local install), so `cryo` itself is never pip-installed below -- both evidence
    # scripts (`from cryo...`) import it straight from the checked-out repo root instead.
    # Confirmed live, 2026-10-12: without this, the v0.1.0 release run failed at the
    # first import with ModuleNotFoundError: No module named 'cryo'.
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # requirements.lock is resolved for 3.12 (pyiceberg-core==0.8.0 caps at <3.13);
      # the runner image's system Python moves with ubuntu-latest.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked migration runtime
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Build bidirectional migration evidence
        run: |
          python scripts/build_upgrade_rollback_evidence.py \
            --revision "${GITHUB_SHA}" \
            --output "cryo-${GITHUB_REF_NAME}-upgrade-rollback.json"

      - name: Upload migration evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: "cryo-${{ github.ref_name }}-upgrade-rollback"
          path: "cryo-${{ github.ref_name }}-upgrade-rollback.json"
          retention-days: 90

      - name: Build fail-closed release evidence dossier
        run: |
          python scripts/build_release_dossier.py \
            --version "${GITHUB_REF_NAME}" \
            --revision "${GITHUB_SHA}" \
            --output "cryo-${GITHUB_REF_NAME}-evidence.json"

      - name: Upload release evidence dossier
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: "cryo-${{ github.ref_name }}-evidence"
          path: "cryo-${{ github.ref_name }}-evidence.json"
          retention-days: 90

  release-image:
    name: Build, scan, attest, and sign (${{ matrix.component }})
    needs: release-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The main app image: api/worker/governor/scheduler, plus the native (Go)
          # engine built as a stage in the same Dockerfile -- see values.yaml's
          # native.image comment ("Same repo/tag/digest as image: above").
          - component: cryo
            dockerfile: Dockerfile
            context: .
            image-suffix: ""
            vuln-type: os,library
          # Frontend. web/Dockerfile.prod (not web/Dockerfile, the dev-server one) is
          # the nginx-unprivileged production build this chart's web.image expects.
          - component: cryo-web
            dockerfile: web/Dockerfile.prod
            context: web
            image-suffix: "-web"
            vuln-type: os,library
          # Self-hosted Spark+Iceberg runner (cryo/engines/spark/k8s.py's spark-submit
          # target). Large image (full Spark distribution) -- expect a longer build.
          # vuln-type scoped to os only: the remaining ~113 findings are in Java jars
          # (jackson-core, netty, etc.) bundled INSIDE apache/spark:4.1.2-python3's own
          # Hadoop distribution, not something this Dockerfile adds -- surgically
          # replacing individual jars in someone else's Spark/Hadoop build risks exactly
          # the binary-compatibility breakage documented elsewhere in this file (Spark
          # minor version must match the Iceberg runtime jar, etc.). Confirmed live,
          # 2026-10-12: apt-get upgrade (below) already closes the 223 OS-package CVEs
          # that were actually ours to fix.
          - component: cryo-spark
            dockerfile: Dockerfile.spark
            context: .
            image-suffix: "-spark"
            vuln-type: os
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.image-suffix }}" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable release image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Block fixable critical/high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: ${{ matrix.vuln-type }}
          severity: CRITICAL,HIGH

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          format: spdx-json
          artifact-name: "${{ matrix.component }}-${{ github.ref_name }}.spdx.json"
          output-file: "${{ matrix.component }}-${{ github.ref_name }}.spdx.json"
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false

      - name: Publish build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless-sign the release digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

  # Publishes deploy/helm/cryo as an OCI chart next to the images, so users can
  #   helm install cryo oci://ghcr.io/tech-pw/charts/cryo --version 0.1.6
  # with no clone. Tags only: a push to main still builds images but never a chart.
  # Versioning: chart version == appVersion == the tag without its "v" (v0.1.6 -> 0.1.6),
  # and the packaged values default to the GHCR images release-image just pushed for the
  # same tag, pinned by digest. scripts/stamp_helm_chart_release.sh does the stamping;
  # the committed Chart.yaml version is a source value only.
  release-chart:
    name: Package, push, and sign the Helm chart
    needs: release-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      CHART_DIR: deploy/helm/cryo
      CHART_REPO: oci://ghcr.io/tech-pw/charts
      CHART_REF: ghcr.io/tech-pw/charts/cryo
      IMAGE_PREFIX: ghcr.io/tech-pw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - name: Install ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.6

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # cosign and oras read the Docker config this writes; helm gets its own login below.
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate Helm to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${REGISTRY_TOKEN}" | helm registry login ghcr.io --username "${REGISTRY_USER}" --password-stdin

      - name: Lint the source chart
        run: helm lint --strict "${CHART_DIR}"

      # Digests of the images release-image pushed for this tag, so the chart pins them.
      - name: Resolve release image digests
        run: |
          # Top-level digest (the one release-image signed), resolved before writing any of them.
          app=$(oras resolve "${IMAGE_PREFIX}/cryo:${GITHUB_REF_NAME}")
          web=$(oras resolve "${IMAGE_PREFIX}/cryo-web:${GITHUB_REF_NAME}")
          spark=$(oras resolve "${IMAGE_PREFIX}/cryo-spark:${GITHUB_REF_NAME}")
          {
            echo "CRYO_IMAGE_DIGEST=${app}"
            echo "CRYO_WEB_IMAGE_DIGEST=${web}"
            echo "CRYO_SPARK_IMAGE_DIGEST=${spark}"
          } >> "$GITHUB_ENV"

      - name: Stamp chart version and image defaults from the tag
        run: |
          scripts/stamp_helm_chart_release.sh "${CHART_DIR}" "${GITHUB_REF_NAME}"
          echo "CHART_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Lint and render the stamped chart
        run: |
          helm lint --strict "${CHART_DIR}"
          helm template cryo "${CHART_DIR}" > /dev/null
          helm template cryo "${CHART_DIR}" --set global.env.CRYO_ENVIRONMENT=prod --set redis.enabled=false > /dev/null

      - name: Package the chart
        run: helm package "${CHART_DIR}" --destination dist

      - name: Push the chart to GHCR
        run: |
          helm push "dist/cryo-${CHART_VERSION}.tgz" "${CHART_REPO}"
          chart_digest=$(oras resolve "${CHART_REF}:${CHART_VERSION}")
          echo "CHART_DIGEST=${chart_digest}" >> "$GITHUB_ENV"

      - name: Keyless-sign the chart digest
        run: cosign sign --yes "${CHART_REF}@${CHART_DIGEST}"

      # Artifact Hub reads repository metadata from the special "artifacthub.io" tag.
      # Skipped until repositoryID in deploy/helm/artifacthub-repo.yml is filled in.
      - name: Push Artifact Hub repository metadata
        working-directory: deploy/helm
        run: |
          if grep -q '^repositoryID: 00000000-0000-0000-0000-000000000000' artifacthub-repo.yml; then
            echo "::notice::artifacthub-repo.yml still has the placeholder repositoryID; not pushing ${CHART_REF}:artifacthub.io"
            exit 0
          fi
          oras push "${CHART_REF}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Upload packaged chart
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: "cryo-chart-${{ github.ref_name }}"
          path: "dist/cryo-*.tgz"
          retention-days: 90
