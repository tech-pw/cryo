name: Secret scan (trufflehog)

# gitleaks (ci.yml) matches secret shapes against .gitleaks.toml. trufflehog is the
# independent second scanner: it checks each candidate against its provider.
# No paths-ignore: a secret can land in docs or Markdown as easily as in code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  # One group per PR (or per ref for non-PR events). A newer push to the same PR
  # cancels that PR's older runs; pushes to main, tags, schedules and manual
  # dispatches are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The action defaults to the floating `latest` image; pin the scanner itself too.
  TRUFFLEHOG_IMAGE: 3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a
  # These detectors verify by connecting to the host written in the string. Test and
  # compose fixtures point at localhost or compose-only hosts, so verification can only
  # error, and every such fixture comes back "unknown". A verified hit from them still fails.
  HOST_DIALING_DETECTORS: JDBC,URI,Postgres,MongoDB,SQLServer,Redis,FTP,LDAP

jobs:
  changes:
    # A PR scans base..head; a push to main scans before..after.
    name: Secret scan (trufflehog, changed commits)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail on verified credentials
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          version: ${{ env.TRUFFLEHOG_IMAGE }}
          extra_args: --results=verified

      - name: Fail on credentials that could not be verified
        # Runs even when the verified pass fails, so one run reports both.
        if: ${{ !cancelled() }}
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          version: ${{ env.TRUFFLEHOG_IMAGE }}
          extra_args: --results=unknown --exclude-detectors=${{ env.HOST_DIALING_DETECTORS }}

  full-history:
    # Re-scans every published commit, so a provider that starts verifying an old
    # credential, or a history rewrite, is caught without waiting for a new commit.
    name: Secret scan (trufflehog, full history)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # An explicit head with no base scans everything reachable from HEAD. Leaving both
      # empty makes the action pick a range from the event, which is a diff on PRs.
      - name: Fail on verified credentials
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          head: HEAD
          version: ${{ env.TRUFFLEHOG_IMAGE }}
          extra_args: --results=verified

      - name: Fail on credentials that could not be verified
        # Runs even when the verified pass fails, so one run reports both.
        if: ${{ !cancelled() }}
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          head: HEAD
          version: ${{ env.TRUFFLEHOG_IMAGE }}
          extra_args: --results=unknown --exclude-detectors=${{ env.HOST_DIALING_DETECTORS }}
