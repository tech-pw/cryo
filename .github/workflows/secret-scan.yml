name: Secret scan (trufflehog)

# gitleaks (ci.yml) matches secret shapes against .gitleaks.toml. trufflehog is the
# independent second scanner: it checks each candidate against its provider and only
# fails on credentials that are live (verified) or could not be checked (unknown).
# No paths-ignore: a secret can land in docs or Markdown as easily as in code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  # One group per PR (or per ref for non-PR events). A newer push to the same PR
  # cancels that PR's older runs; pushes to main, tags, schedules and manual
  # dispatches are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    # A PR scans base..head; a push to main scans before..after.
    name: Secret scan (trufflehog, changed commits)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan changed commits
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          # The action defaults to the floating `latest` image; pin the scanner itself too.
          version: 3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a
          extra_args: --results=verified,unknown

  full-history:
    # Re-scans every published commit, so a provider that starts verifying an old
    # credential, or a history rewrite, is caught without waiting for a new commit.
    name: Secret scan (trufflehog, full history)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full git history
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          version: 3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a
          extra_args: --results=verified,unknown
