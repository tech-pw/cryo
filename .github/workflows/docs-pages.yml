name: docs

on:
  push:
    branches: [main, gitlab-main]
    paths:
      - "site/**"
      - ".github/workflows/docs-pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  check:
    name: Check generated pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify generated pages match the sources
        run: node site/scripts/build.mjs --check

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stage the publishable tree
        run: |
          mkdir _site
          rsync -a --exclude '_src' --exclude 'scripts' --exclude 'README.md' --exclude '.DS_Store' site/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
