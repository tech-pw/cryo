name: docs

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs-pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deploys (push / workflow_dispatch) share the single "docs-pages" group and are
  # never cancelled, so Pages publishes stay serialized. Each PR gets its own group
  # so PRs neither queue behind nor cancel each other; a newer push to the same PR
  # cancels that PR's older run.
  group: ${{ github.event_name == 'pull_request' && format('docs-pages-pr-{0}', github.event.pull_request.number) || 'docs-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check generated pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Verify generated pages match the sources
        run: node site/scripts/build.mjs --check

  deploy:
    # Pages is unavailable while the repository is private, so deploy only once it is public.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !github.event.repository.private
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Stage the publishable tree
        run: |
          mkdir _site
          rsync -a --exclude '_src' --exclude 'scripts' --exclude 'README.md' --exclude '.DS_Store' --exclude 'assets/img/screens/*.png' site/ _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1