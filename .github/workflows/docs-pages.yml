name: docs

on:
  push:
    branches: [main, gitlab-main]
    paths:
      - "site/**"
      - ".github/workflows/docs-pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  check:
    name: Check generated pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify generated pages match the sources
        run: node site/scripts/build.mjs --check

  deploy:
    # Pages is unavailable while the repository is private, so deploy only once it is public.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !github.event.repository.private
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Stage the publishable tree
        run: |
          mkdir _site
          rsync -a --exclude '_src' --exclude 'scripts' --exclude 'README.md' --exclude '.DS_Store' site/ _site/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5