name: Install locked Python dependencies
description: >-
  Install the project and its dev tools at the exact versions pinned in uv.lock, the same
  lock the production image installs from, so CI checks what ships.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.1"
        enable-cache: false
    - shell: bash
      run: |
        set -euo pipefail
        uv export --frozen --extra dev --no-emit-project --no-header --format requirements-txt \
          --output-file "$RUNNER_TEMP/requirements-dev.lock"
        python -m pip install -U pip
        python -m pip install --require-hashes --requirement "$RUNNER_TEMP/requirements-dev.lock"
        python -m pip install --no-deps -e .
