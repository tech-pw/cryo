name: Feature request
description: Propose a new capability or a meaningful change
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and the docs first. Until 1.0, only the latest tag is supported.
        Cite docs/OSS_READINESS.md for anything that should stay out of the launch surface.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you have to do by hand today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
  - type: dropdown
    id: pr
    attributes:
      label: Willing to send a PR?
      options:
        - "yes"
        - "no"
        - needs design first
