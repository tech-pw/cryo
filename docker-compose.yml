services:
  minio:
    image: minio/minio:latest
    container_name: iceberg-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: iceberg-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse &&
      echo 'MinIO bucket warehouse is ready'
      "

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: iceberg-rest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  trino:
    image: trinodb/trino:latest
    container_name: iceberg-trino
    depends_on:
      - iceberg-rest
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog

  postgres:
    image: postgres:16-alpine
    container_name: iceberg-postgres
    environment:
      POSTGRES_DB: cryo
      POSTGRES_USER: cryo
      POSTGRES_PASSWORD: cryo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryo -d cryo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: iceberg-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  spark:
    build:
      context: ./docker/spark-runner
    image: cryo-spark-runner:local
    container_name: iceberg-spark
    depends_on:
      iceberg-rest:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      ICEBERG_CATALOG: rest
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://warehouse/
      S3_ENDPOINT: http://minio:9000
      HOME: /tmp
      PYTHONPATH: /workspace/scripts
      SPARK_LOCAL_DIRS: /tmp/spark
    working_dir: /workspace
    command: ["bash", "-lc", "sleep infinity"]
    ports:
      - "4040:4040"
    volumes:
      - .:/workspace
      - spark-ivy:/tmp/.ivy2
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import pyspark'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  minio-data:
  postgres-data:
  redis-data:
  spark-ivy:
