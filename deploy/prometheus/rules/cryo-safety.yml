groups:
  - name: cryo-safety-slos
    rules:
      - alert: CryoPausePropagationSlow
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(cryo_maintenance_pause_propagation_seconds_bucket[10m]))
          ) > 5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Cryo pause propagation exceeds the 5 second p99 objective"
          runbook: "docs/SLOS.md#pause-propagation"

      - alert: CryoReconciliationRPOBreached
        expr: cryo_maintenance_reconciliation_oldest_age_seconds > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "An uncertain maintenance effect has remained unresolved for over 15 minutes"
          runbook: "docs/SLOS.md#uncertain-effect-recovery"

      - alert: CryoReconciliationStalled
        expr: |
          cryo_maintenance_reconciliation_backlog > 0
          and
          sum(increase(cryo_maintenance_reconciliation_outcomes_total{
            outcome=~"resumed|manual_review|superseded"
          }[15m])) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cryo has a reconciliation backlog with no terminal progress"
          runbook: "docs/SLOS.md#uncertain-effect-recovery"

      - alert: CryoApiErrorBudgetBurn
        expr: |
          (
            sum(rate(cryo_api_requests_total{status_class="5xx"}[10m]))
            /
            clamp_min(sum(rate(cryo_api_requests_total[10m])), 0.001)
          ) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cryo API 5xx ratio is above 1 percent"
          runbook: "docs/SLOS.md#control-plane-api"

      - alert: CryoRolloutAutomaticallyHalted
        expr: increase(cryo_rollout_decisions_total{decision="halt"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Cryo automatically halted a maintenance rollout cohort"
          runbook: "docs/SAFE_ROLLOUT.md"

      # : cryo_scheduler_unmatched_tables (added for the 2026-08-12 incident, see
      # cryo/config.py's unmatched_tables_check_interval_hours docstring) has existed with no
      # alert on it -- the 2026-08-12 incident itself (1,267 needs_compaction=True tables,
      # including a 24TB table, matching no enabled preset) was found only by manual
      # investigation. `for: 6h` matches the sweep's own default check interval
      # (unmatched_tables_check_interval_hours) so this can't fire on a single mid-migration
      # sample between two sweeps -- it requires the gauge to still read high on a later sweep.
      #
      # Threshold raised 100 -> 200, same day (): enabling default-native-deep as the
      # true fleet-wide catchall dropped live unmatched count 1,894 -> 125 -- comfortably under
      # 200, with real margin against normal churn (new scratch-schema tables landing before
      # classification, etc.) that would have sat right on top of a 100 threshold and risked
      # a false positive on day one.
      - alert: CryoUnmatchedNeedsCompactionTablesHigh
        expr: cryo_scheduler_unmatched_tables{needs_compaction="true"} > 200
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Over 200 tables needing compaction resolve to no effective preset and are never scheduled for maintenance"
          runbook: "docs/operator-guide.md#unmatched-tables"
