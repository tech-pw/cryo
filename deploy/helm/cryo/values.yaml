# Cryo Helm chart — deploy API, worker, governor, scheduler, and scanner CronJob.

image:
  repository: cryo
  tag: latest
  # Always, not IfNotPresent: without a CI pipeline minting immutable per-build tags, "latest"
  # is a mutable tag most self-hosted deployments will reuse across rebuilds. IfNotPresent skips
  # re-pulling whenever a node already has *any* image cached under that tag string (it doesn't
  # compare digests), so a redeploy after rebuilding the image can silently keep running the old
  # code with no error -- `helm upgrade` reports success either way. Always avoids that trap; the
  # extra registry round-trip per pod start is worth it for a self-hosted app without a mature
  # release pipeline. Switch to IfNotPresent (and give every build its own tag, e.g. a git SHA)
  # once you have one.
  pullPolicy: Always

imagePullSecrets: []

global:
  env:
    CRYO_ENVIRONMENT: prod
    CRYO_SCAN_TABLE_TIMEOUT_SECONDS: "600"
    # pyiceberg (default) or go — Go uses cryo-engine-go scan-stats (streaming manifests).
    # CRYO_SCAN_ENGINE: go
  envFromSecret: ""
  envFromConfigMap: ""

api:
  replicas: 2
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      # 1Gi, then 3Gi, both OOM'd on a catalog with thousands of tables: smart-maintenance
      # overview materialized every TableStats row (incl. its raw JSONB blob) into Python just
      # to count tiers in a loop. Fixed to aggregate in SQL instead (see
      # routes_smart_maintenance.py::smart_maintenance_overview) -- 6Gi is now a safety margin,
      # not the load-bearing fix. Bump proportionally to your own table count if it's still tight.
      memory: 6Gi

worker:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

governor:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      # S3LogIngestRunner reads log objects with s3_log_ingest_concurrency (default 16)
      # concurrent threads -- 500m throttled that work to a crawl in practice against a real
      # bucket's log volume. 1 full core keeps that concurrency genuinely concurrent instead
      # of CPU-starved.
      cpu: "1"
      # The periodic benefit-score updater loads every table's partitions into memory in one
      # pass -- 512Mi OOMs well before a catalog reaches tens of thousands of partitions. Bump
      # proportionally to your own partition count if this still isn't enough.
      memory: 2Gi

scannerWorker:
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  # After Go scan-stats + PyIceberg plan_files removal, peak RSS drops enough that
  # 8 replicas are no longer required to avoid OOM. Start at 3; raise if scan lag grows.
  # Set CRYO_SCAN_ENGINE=go on scanner workers once parity is verified in the target env.

scanner:
  schedule: "0 */6 * * *"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

native:
  enabled: false
  image:
    repository: cryo
    tag: latest
    pullPolicy: Always # see the comment on image.pullPolicy above
  serviceAccount: default
  ttlSecondsAfterFinished: 300
  defaultChunkSizeGb: 100
  maxCpu: 4000m
  maxMemory: 16Gi

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

migration:
  image:
    repository: cryo
    tag: latest
    pullPolicy: Always # see the comment on image.pullPolicy above

web:
  enabled: false
  replicas: 2
  image:
    repository: cryo-web
    tag: latest
    pullPolicy: Always # see the comment on image.pullPolicy above
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

service:
  type: ClusterIP
  port: 8000
