# Cryo Helm chart — deploy API, worker, governor, scheduler, and scanner CronJob.

image:
  repository: cryo
  tag: latest
  # Always, not IfNotPresent: without a CI pipeline minting immutable per-build tags, "latest"
  # is a mutable tag most self-hosted deployments will reuse across rebuilds. IfNotPresent skips
  # re-pulling whenever a node already has *any* image cached under that tag string (it doesn't
  # compare digests), so a redeploy after rebuilding the image can silently keep running the old
  # code with no error -- `helm upgrade` reports success either way. Always avoids that trap; the
  # extra registry round-trip per pod start is worth it for a self-hosted app without a mature
  # release pipeline. Switch to IfNotPresent (and give every build its own tag, e.g. a git SHA)
  # once you have one.
  pullPolicy: Always

imagePullSecrets: []

global:
  env:
    CRYO_ENVIRONMENT: prod
    CRYO_SCAN_TABLE_TIMEOUT_SECONDS: "600"
    # Go scan-stats (streaming manifests). Override to "pyiceberg" to fall back.
    CRYO_SCAN_ENGINE: go
  envFromSecret: ""
  envFromConfigMap: ""

api:
  replicas: 2
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      # 1Gi, then 3Gi, both OOM'd on a catalog with thousands of tables: smart-maintenance
      # overview materialized every TableStats row (incl. its raw JSONB blob) into Python just
      # to count tiers in a loop. Fixed to aggregate in SQL instead (see
      # routes_smart_maintenance.py::smart_maintenance_overview) -- 6Gi is now a safety margin,
      # not the load-bearing fix. Bump proportionally to your own table count if it's still tight.
      memory: 6Gi

worker:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

governor:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      # S3LogIngestRunner reads log objects with s3_log_ingest_concurrency (default 16)
      # concurrent threads -- 500m throttled that work to a crawl in practice against a real
      # bucket's log volume. 2 full cores keep that concurrency genuinely concurrent alongside
      # the benefit-score-updater and report-scheduler threads sharing the same process.
      cpu: "2"
      # The periodic benefit-score updater loads one table's partitions into memory at a time --
      # fine for the median table, but a real catalog's partition-count distribution is
      # extremely long-tailed (observed: p50=4, p99=2.7k, max=397k partitions on one table), so
      # sizing must cover the outlier, not the median. This pod also runs several other daemon
      # threads in the same process (table-alert-dispatcher, s3-log-ingest, report-scheduler)
      # that all fire their first pass on startup, so restarts briefly stack multiple heavy jobs
      # concurrently -- 2Gi, then 4Gi, both proved insufficient headroom for that burst even
      # after fixing the benefit-score updater's own memory leak.
      memory: 6Gi

scannerWorker:
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      # After Go scan-stats + PyIceberg plan_files removal, peak RSS drops enough that
      # 8 replicas are no longer required to avoid OOM (see docs/scanner-data-points.md) --
      # dropped to 3, raise if scan lag grows. On top of that, keep memory at 3Gi rather than
      # reverting to 2Gi: this fleet's partition-count distribution is extremely long-tailed
      # (p50=4, p99=2.7k, max=397k partitions on one table), so even a leaner engine benefits
      # from headroom against that outlier rather than the median table.
      memory: 3Gi
  # Scanner engine is set via global.env.CRYO_SCAN_ENGINE (default: go).

scanner:
  schedule: "0 */6 * * *"
  suspend: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

native:
  # When true: create ServiceAccount+RBAC for Job dispatch / live capacity, and
  # pin Worker+Governor pods onto that SA. Destination configs still need
  # k8s_dispatch=true to create Jobs instead of subprocess.
  enabled: false
  image:
    repository: cryo
    tag: latest
    pullPolicy: Always # see the comment on image.pullPolicy above
  # Overridden to the chart-managed SA when enabled=true (see worker/governor templates).
  serviceAccount: default
  ttlSecondsAfterFinished: 300
  defaultChunkSizeGb: 100
  maxCpu: 4000m
  maxMemory: 16Gi
  # Spot is gated (scoping §6.5): never the default for large/uncheckpointed jobs.
  spot:
    allow: false
    maxChunkSizeGb: 50
    maxEstimatedDurationSeconds: 1800
    requireCheckpointing: true
  keda:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    pollingInterval: 15
    cooldownPeriod: 60
    # Redis admitted-job LIST used by RedisMaintenanceQueue (`cryo:admitted`).
    redisAddress: "cryo-redis:6379"
    redisListName: "cryo:admitted"
    listLength: "1"
    redisPasswordFromSecret: false
  karpenter:
    # When true, install a ConfigMap with recommended NodePool notes (no CRDs).
    installNotes: true

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

migration:
  image:
    repository: cryo
    tag: latest
    pullPolicy: Always # see the comment on image.pullPolicy above

web:
  enabled: false
  replicas: 2
  image:
    repository: cryo-web
    tag: latest
    pullPolicy: Always # see the comment on image.pullPolicy above
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

service:
  type: ClusterIP
  port: 8000
