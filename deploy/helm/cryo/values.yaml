# Cryo Helm chart — deploy API, worker, governor, scheduler, and scanner CronJob.

image:
  repository: cryo
  tag: latest
  # Always, not IfNotPresent: without a CI pipeline minting immutable per-build tags, "latest"
  # is a mutable tag most self-hosted deployments will reuse across rebuilds. IfNotPresent skips
  # re-pulling whenever a node already has *any* image cached under that tag string (it doesn't
  # compare digests), so a redeploy after rebuilding the image can silently keep running the old
  # code with no error -- `helm upgrade` reports success either way. Always avoids that trap; the
  # extra registry round-trip per pod start is worth it for a self-hosted app without a mature
  # release pipeline. Switch to IfNotPresent (and give every build its own tag, e.g. a git SHA)
  # once you have one.
  pullPolicy: Always

imagePullSecrets: []

global:
  env:
    CRYO_ENVIRONMENT: prod
    CRYO_SCAN_TABLE_TIMEOUT_SECONDS: "600"
  envFromSecret: ""
  envFromConfigMap: ""

api:
  replicas: 2
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      # 1Gi, then 3Gi, both OOM'd on a catalog with thousands of tables: smart-maintenance
      # overview materialized every TableStats row (incl. its raw JSONB blob) into Python just
      # to count tiers in a loop. Fixed to aggregate in SQL instead (see
      # routes_smart_maintenance.py::smart_maintenance_overview) -- 6Gi is now a safety margin,
      # not the load-bearing fix. Bump proportionally to your own table count if it's still tight.
      memory: 6Gi

worker:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

governor:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      # S3LogIngestRunner reads log objects with s3_log_ingest_concurrency (default 16)
      # concurrent threads -- 500m throttled that work to a crawl in practice against a real
      # bucket's log volume. 2 full cores keep that concurrency genuinely concurrent alongside
      # the benefit-score-updater and report-scheduler threads sharing the same process.
      cpu: "2"
      # The periodic benefit-score updater loads one table's partitions into memory at a time --
      # fine for the median table, but a real catalog's partition-count distribution is
      # extremely long-tailed (observed: p50=4, p99=2.7k, max=397k partitions on one table), so
      # sizing must cover the outlier, not the median. This pod also runs several other daemon
      # threads in the same process (table-alert-dispatcher, s3-log-ingest, report-scheduler)
      # that all fire their first pass on startup, so restarts briefly stack multiple heavy jobs
      # concurrently -- 2Gi, then 4Gi, both proved insufficient headroom for that burst even
      # after fixing the benefit-score updater's own memory leak.
      memory: 6Gi

scannerWorker:
  replicas: 8
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      # Scanning a table materializes all of its partitions in memory before
      # scanner_max_partitions_per_table (default 5000) trims them down for storage -- on a
      # fleet with a long-tailed partition-count distribution (max observed: 397k partitions on
      # one table), that pre-trim working set can spike well past a table with the median (4)
      # or even p99 (2.7k) partition count. 2Gi had no observed crash yet, but no real margin
      # for that outlier either.
      memory: 3Gi

scanner:
  schedule: "0 */6 * * *"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

native:
  enabled: false
  image:
    repository: cryo
    tag: latest
    pullPolicy: Always # see the comment on image.pullPolicy above
  serviceAccount: default
  ttlSecondsAfterFinished: 300
  defaultChunkSizeGb: 100
  maxCpu: 4000m
  maxMemory: 16Gi

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

migration:
  image:
    repository: cryo
    tag: latest
    pullPolicy: Always # see the comment on image.pullPolicy above

web:
  enabled: false
  replicas: 2
  image:
    repository: cryo-web
    tag: latest
    pullPolicy: Always # see the comment on image.pullPolicy above
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

service:
  type: ClusterIP
  port: 8000
