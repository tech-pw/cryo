# Cryo Helm chart — deploy API, worker, governor, scheduler, and scanner CronJob.

image:
  repository: cryo
  tag: latest
  # Production releases should set an immutable sha256 digest; tag remains a readable fallback.
  digest: ""
  # Always, not IfNotPresent: without a CI pipeline minting immutable per-build tags, "latest"
  # is a mutable tag most self-hosted deployments will reuse across rebuilds. IfNotPresent skips
  # re-pulling whenever a node already has *any* image cached under that tag string (it doesn't
  # compare digests), so a redeploy after rebuilding the image can silently keep running the old
  # code with no error -- `helm upgrade` reports success either way. Always avoids that trap; the
  # extra registry round-trip per pod start is worth it for a self-hosted app without a mature
  # release pipeline. Switch to IfNotPresent (and give every build its own tag, e.g. a git SHA)
  # once you have one.
  pullPolicy: Always

imagePullSecrets: []

# ServiceAccount every Cryo pod runs as. On EKS, put the IRSA role here -- without it
# pods fall back to the node instance role, which typically cannot read the warehouse
# buckets, and scans fail with AccessDenied well after onboarding reported success.
#
#   serviceAccount:
#     annotations:
#       eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<cryo-role>
serviceAccount:
  create: true
  # Defaults to the release fullname. Set this (with create: false) to reuse a
  # ServiceAccount managed outside this chart.
  name: ""
  annotations: {}

# Applied to every pod. UID/GID 10001 is the `cryo` user baked into the Cryo image; redis and
# web override it to their own images' non-root users. fsGroup also lets the non-root user read
# the projected IRSA web-identity token, which is otherwise root-only.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop: ["ALL"]

global:
  env:
    # Secure by default: prod turns off the self-issued dev token and refuses to start
    # without a real CRYO_SECRET_KEY. The chart refuses to render prod without image
    # digests. For a throwaway local install, set this to dev explicitly.
    CRYO_ENVIRONMENT: prod
    CRYO_SCAN_TABLE_TIMEOUT_SECONDS: "600"
    # Go scan-stats (streaming manifests). Override to "pyiceberg" to fall back.
    CRYO_SCAN_ENGINE: go
  envFromSecret: ""
  envFromConfigMap: ""

observability:
  prometheusScrape: true
  metricsPort: 8081

api:
  replicas: 2
  port: 8000
  # Uvicorn processes per pod. Endpoints are mostly sync and CPU-bound on JSON
  # serialization, so one process lets a single heavy response stall every other request.
  workers: 2
  probe:
    livenessInitialDelaySeconds: 10
    readinessInitialDelaySeconds: 5
  # Ask Cryo streams SSE on POST /api/v1/assistant/conversations/{id}/messages.
  # This chart has no Ingress. The ingress in front of the API Service must set
  # proxy-buffering off and a read timeout of at least 60s for that path.
  ingressAnnotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      # 1Gi, then 3Gi, both OOM'd on a catalog with thousands of tables: smart-maintenance
      # overview materialized every TableStats row (incl. its raw JSONB blob) into Python just
      # to count tiers in a loop. Fixed to aggregate in SQL instead (see
      # routes_smart_maintenance.py::smart_maintenance_overview) -- 6Gi is now a safety margin,
      # not the load-bearing fix. Bump proportionally to your own table count if it's still tight.
      memory: 6Gi

worker:
  replicas: 2
  # Readiness + liveness on the daemon's /healthz (observability.metricsPort). It turns 503
  # after 5 consecutive failed loop ticks, or when one tick has run longer than
  # tickStallSeconds (0 = no hung-tick check). Off for the worker by default: one
  # tick can wait on an engine job for hours. Set it above your longest expected job if you want it.
  probe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    readinessFailureThreshold: 2
    livenessFailureThreshold: 4
    tickStallSeconds: 0
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

governor:
  replicas: 1
  probe:
    initialDelaySeconds: 10
    periodSeconds: 30
    readinessFailureThreshold: 2
    livenessFailureThreshold: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

scheduler:
  replicas: 1
  # Readiness + liveness on the daemon's /healthz (observability.metricsPort). It turns 503
  # after 5 consecutive failed loop ticks, or when one tick has run longer than
  # tickStallSeconds (0 = no hung-tick check). A scheduler tick only evaluates
  # crons and enqueues work, so an hour inside one tick means it is hung.
  probe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    readinessFailureThreshold: 2
    livenessFailureThreshold: 4
    tickStallSeconds: 3600
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      # S3LogIngestRunner reads log objects with s3_log_ingest_concurrency (default 16)
      # concurrent threads -- 500m throttled that work to a crawl in practice against a real
      # bucket's log volume. 2 full cores keep that concurrency genuinely concurrent alongside
      # the benefit-score-updater and report-scheduler threads sharing the same process.
      cpu: "2"
      # The periodic benefit-score updater loads one table's partitions into memory at a time --
      # fine for the median table, but a real catalog's partition-count distribution is
      # extremely long-tailed (observed: p50=4, p99=2.7k, max=397k partitions on one table), so
      # sizing must cover the outlier, not the median. This pod also runs several other daemon
      # threads in the same process (table-alert-dispatcher, s3-log-ingest, report-scheduler)
      # that all fire their first pass on startup, so restarts briefly stack multiple heavy jobs
      # concurrently -- 2Gi, then 4Gi, both proved insufficient headroom for that burst even
      # after fixing the benefit-score updater's own memory leak.
      memory: 6Gi

scannerWorker:
  replicas: 3
  # Readiness + liveness on the daemon's /healthz (observability.metricsPort). It turns 503
  # after 5 consecutive failed loop ticks, or when one tick has run longer than
  # tickStallSeconds (0 = no hung-tick check). Stale scan chunks are reclaimed after
  # 15 minutes, so a tick running an hour is hung.
  probe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    readinessFailureThreshold: 2
    livenessFailureThreshold: 4
    tickStallSeconds: 3600
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      # After Go scan-stats + PyIceberg plan_files removal, peak RSS drops enough that
      # 8 replicas are no longer required to avoid OOM (see docs/scanner-data-points.md) --
      # dropped to 3, raise if scan lag grows. On top of that, keep memory at 3Gi rather than
      # reverting to 2Gi: this fleet's partition-count distribution is extremely long-tailed
      # (p50=4, p99=2.7k, max=397k partitions on one table), so even a leaner engine benefits
      # from headroom against that outlier rather than the median table.
      memory: 3Gi
  # Scanner engine is set via global.env.CRYO_SCAN_ENGINE (default: go).
  autoscaling:
    # HPA-managed replica count instead of the fixed `replicas` above -- see
    # scanner-worker-hpa.yaml for why (this Deployment polls an ad-hoc scan queue that's
    # empty most of the time, so a fixed replica count sized for the largest burst sits
    # mostly idle otherwise). `replicas` above still applies as the Deployment's initial
    # replica count only when both HPA and KEDA are disabled.
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    # Off (null) by default. CPython rarely returns heap to the OS after a scan, so idle
    # scanner workers sit above their memory request and a memory target pins the HPA at
    # maxReplicas at 0% CPU. Set a percentage only if your workers' idle memory is well
    # under the request. For queue-driven scaling use keda.enabled below.
    targetMemoryUtilizationPercentage: null
    scaleDownStabilizationSeconds: 300
    # Cost remediation plan §5, 2026-09-16 (docs/CRYO_UNUSED_COST_FIX_2026-09-16.md): the CPU/
    # memory HPA above sits at its floor of 3 replicas nearly continuously between ad-hoc scan
    # bursts (observed 0% CPU / 68-80% memory) because CPU/mem utilization lags real queue
    # demand. This KEDA path scales on chunks_pending+chunks_running (cli.py's
    # _scanner_scale_metric, served by the API's /scale-metric route) instead -- "pending
    # plus actively claimed" scan chunks, matching the cost doc's exact recommendation and
    # avoiding the raw-queue-length blind spot (drops to 0 the instant a chunk is claimed, long
    # before that chunk's scan finishes) the doc explicitly warns against. Requires the KEDA
    # operator installed in the cluster. KEDA takes precedence over `enabled` above:
    # the plain HPA is omitted when KEDA is enabled. Either autoscaler prevents Helm
    # from setting a fixed Deployment replica count.
    keda:
      enabled: false
      # 0 = scale to zero when no ad-hoc scan is in flight, which is the overwhelmingly
      # common case: this queue is fed by UI/API "Trigger scan" requests, and in the 30 days
      # to 2026-09-22 prod served exactly zero of them (last one 2026-08-25), while holding a
      # pod at 500m CPU / 256Mi reserved around the clock. The full-fleet 6-hourly sweep does
      # NOT use this Deployment -- scanner-cronjob.yaml brings up its own pods and they exit
      # when done -- so nothing here needs to be resident on a schedule either.
      #
      # The cost of zero is cold-start latency on the next ad-hoc scan: up to pollingInterval
      # (15s) to notice, plus image pull and process start. Accepted deliberately; a scan that
      # walks thousands of tables is not latency-sensitive at the tens-of-seconds scale.
      minReplicas: 0
      maxReplicas: 8
      pollingInterval: 15
      cooldownPeriod: 120
      targetValue: "1"

scanner:
  schedule: "0 */6 * * *"
  suspend: false
  # Parallel scanner pods per run. Drives completions, parallelism AND --num-chunks together
  # so they cannot drift apart -- a --num-chunks larger than completions silently drops the
  # unclaimed chunks, which is the 2026-09-22 bug (see scanner-cronjob.yaml).
  chunks: 4
  # Forbid: a new run does not start while the previous one is still going.
  concurrencyPolicy: Forbid
  # Kill a scanner Job that is still running after this long (5.5h, under the 6h schedule).
  # Set to null to disable.
  activeDeadlineSeconds: 19800
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  jobDispatch:
    # When true (requires native.enabled too -- reuses its image/ServiceAccount/RBAC):
    # Governor claims ad-hoc scan chunks from the Redis scan queue (DB-stranded
    # fallback included) and dispatches each as its own sized Kubernetes Job instead
    # of leaving them to the always-on scannerWorker Deployment. See
    # cryo/governor/scan_admit.py. Off by default -- validate in dev before prod.
    enabled: false
    batchSize: 1

# Batch maintenance (templates/maintenance-cronjob.yaml, docs/BATCH_MAINTENANCE.md).
# Requires spark.k8s.enabled for the Spark image and ServiceAccounts.
maintenance:
  enabled: false
  # Kubernetes CronJob times are UTC unless a timeZone is set.
  schedule: "0 19 * * *"
  suspend: false
  topN: 500
  maxLanes: 4
  laneMaxCpuMilli: 4000
  laneMaxMemMib: 16384
  # Optional inclusive node vCPU ceiling; requires Karpenter instance-cpu labels.
  # Keep 0 on other clusters. Validate node packing and total cost before enabling.
  laneMaxNodeCpu: 0
  # Karpenter capacity types for lane pods, most preferred first. Replaces the
  # karpenter.sh/capacity-type pin inherited from spark.k8s.nodeSelector; "" keeps that pin.
  # Lanes survive node loss (partial-progress commits + replacement lanes), so spot is safe.
  laneCapacityTypes: "spot,on-demand"
  maxRuntimeMinutes: 360
  # Hours before a maintained table is eligible again. Longer than a day lets the ranking move
  # past the hottest tables so the run rotates through the fleet instead of re-picking them.
  cooldownHours: 20
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

backup:
  enabled: false
  schedule: "0 2 * * *"
  s3Uri: ""
  retentionDays: 30
  backoffLimit: 2
  serviceAccount: default
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

native:
  # When true: Helm renders Governor + Worker (legacy path) Job/Secret RBAC; Governor
  # creates sized Jobs on admit (destination config k8s_dispatch=true). Hard max memory
  # request is 16Gi — Python clamps even if this value is set higher.
  enabled: false
  image:
    repository: cryo
    tag: latest
    digest: ""
    pullPolicy: Always # see the comment on image.pullPolicy above
  # Overridden to the chart-managed SA when enabled=true (see worker/governor templates).
  serviceAccount: default
  # Keep logs/results available across short Governor outages.
  ttlSecondsAfterFinished: 3600
  maxCpu: 4000m
  # Absolute upper bound for any native maintenance pod request (do not raise).
  maxMemory: 16Gi
  # Spot is gated (scoping §6.5): never the default for large/uncheckpointed jobs.
  spot:
    allow: false
    maxChunkSizeGb: 50
    maxEstimatedDurationSeconds: 1800
    requireCheckpointing: true
  keda:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    pollingInterval: 15
    cooldownPeriod: 60
    # Redis admitted-job LIST used by RedisMaintenanceQueue (`cryo:admitted`).
    # Must be the FQDN: the KEDA operator runs in its own namespace, so the
    # short service name doesn't resolve cross-namespace.
    redisAddress: "cryo-redis.cryo.svc.cluster.local:6379"
    redisListName: "cryo:admitted"
    listLength: "1"
    redisPasswordFromSecret: false
  karpenter:
    # When true, install a ConfigMap with recommended NodePool notes (no CRDs).
    installNotes: true
    # When true, install a REAL dedicated NodePool + EC2NodeClass for native-engine /
    # scan Jobs (see templates/karpenter-nodepool.yaml) -- requires Karpenter CRDs
    # already installed cluster-wide, and the subnet/SG/role values below set to
    # match your cluster (they are cluster-specific; there is no safe cross-cluster
    # default). Off by default: stand this up once native.enabled/scanner.jobDispatch
    # are producing real Job traffic to size nodes for, not before.
    installNodePool: false
    instanceProfileRole: ""
    subnetTagKey: "Name"
    subnetTagValue: ""
    securityGroupTagKey: ""
    securityGroupTagValue: ""
    consolidateAfter: "5m"
    expireAfter: "720h"
    limitCpu: "64"
    limitMemory: "256Gi"

# Recovery plan §2, 2026-09-20: RBAC + dedicated ServiceAccount for the bounded one-shot
# analysis-task K8s Jobs (see cryo/analysis/runner.py, cryo/analysis/dispatch.py). The scheduler
# dispatches these Jobs in place of the old in-process benefit-score-sweep thread; each Job runs
# one batch of a durable analysis_tasks row and exits. Job resource sizing itself lives in
# cryo/analysis/dispatch.py (not here) pending real R1 profiling numbers against the live fleet.
analysis:
  enabled: false

spark:
  # Cryo-managed Spark-on-Kubernetes (cryo.engines.spark.k8s) -- no cloud Spark
  # service required. Intended as the SQL fallback for tables the native engine
  # can't safely handle (destination.config.sql_fallback_destination_id).
  k8s:
    enabled: false
    image:
      # Same GitLab container registry project as the main image (there is no separate
      # "cryo-spark" project), distinguished by tag only -- mirrors how cryo-web reuses
      # this project's registry with the "web-latest" tag.
      repository: cryo
      tag: spark-latest
      digest: ""
      pullPolicy: IfNotPresent
    # Overridden to the chart-managed SA when enabled=true (see rbac-spark.yaml).
    serviceAccount: default
    driverCpuMilli: 1000
    driverMemMib: 2048
    executorCpuMilli: 2000
    executorMemMib: 4096
    executorInstances: 2
    activeDeadlineSeconds: 7200
    ttlSecondsAfterFinished: 3600
    slotCap: 2
    # Arch is required, not a capacity preference. ghcr.io/tech-pw/cryo-spark is
    # amd64-only; a selector that omits kubernetes.io/arch lands the wrapper Job on
    # Graviton and spark-submit dies with "exec format error" before Spark starts.
    # The app merges this pin back if a destination selector drops it. Remove the
    # arch pin only after the published image is a multi-arch manifest list.
    nodeSelector: "karpenter.sh/capacity-type=on-demand,kubernetes.io/arch=amd64"

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    digest: ""
    pullPolicy: IfNotPresent
  port: 6379
  probe:
    readinessInitialDelaySeconds: 5
    livenessInitialDelaySeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Backstop only. With per-key TTLs in cryo/queue/redis_queue.py the steady state is a few MB,
  # so reaching this means something started leaking again -- and it should surface as loud,
  # bounded write errors rather than the kernel OOMKilling the container and taking the whole
  # queue with it. Held well under the 512Mi limit because RSS runs above used_memory
  # (36.8MiB vs 31.8MiB measured in prod) and the allocator does not return freed pages
  # promptly.
  maxmemory: 320mb
  # noeviction, not an LRU policy: these keys are jobs and locks, and silently evicting one
  # loses work with no record. Refusing the write is recoverable; dropping it is not.
  maxmemoryPolicy: noeviction
  # RDB snapshotting off. /data is the container's ephemeral layer -- there is no volume, so
  # the 10MB dump.rdb prod was writing could never be read back after a restart. It bought no
  # durability and cost real disk I/O plus a fork that can transiently double RSS, which is
  # the worst thing to do next to a memory limit. Durability here is Postgres: both
  # reconcile_queued_jobs and orphan recovery rebuild Redis state from it after a restart.
  save: ""
  # The official redis:7-alpine image's `redis` user.
  podSecurityContext:
    runAsUser: 999
    runAsGroup: 1000
    fsGroup: 1000

migration:
  # The migration job runs the API image (image.repository plus image.digest, or image.tag)
  # unless you set a separate migration image here. Leave repository and digest empty to
  # follow the API image: the old defaults (cryo:latest) ignored image.digest and the
  # pre-install hook could not pull (issue #140).
  image:
    # Set to run migrations from a different image. Empty follows image.repository.
    repository: ""
    # Used only with an explicit repository above. Empty falls back to image.tag.
    tag: ""
    # Set alone to pin the API repository at a different digest. Empty follows image.digest.
    digest: ""
    # Empty follows image.pullPolicy.
    pullPolicy: ""
  # Alembic occasionally needs more than one attempt against a cold/just-provisioned
  # database (e.g. a connection racing the DB's own readiness) before the pre-install/
  # pre-upgrade hook gives up and blocks the release.
  backoffLimit: 2

web:
  enabled: false
  replicas: 2
  image:
    repository: cryo-web
    tag: latest
    digest: ""
    pullPolicy: Always # see the comment on image.pullPolicy above
  # nginx-unprivileged's `nginx` user; it listens on 8080 (web/nginx.conf).
  # The web Deployment injects CRYO_API_UPSTREAM as the API Service FQDN and
  # NGINX_ENTRYPOINT_LOCAL_RESOLVERS so nginx uses the pod nameserver, not kube-dns.
  port: 8080
  # Strict-Transport-Security from the web nginx. Off by default because an install without
  # TLS must not send it. Turn it on only when the UI is served over HTTPS: browsers then
  # refuse plain HTTP for this host for maxAgeSeconds.
  hsts:
    enabled: false
    maxAgeSeconds: 31536000
    includeSubDomains: false
    preload: false
  probe:
    livenessInitialDelaySeconds: 5
    readinessInitialDelaySeconds: 3
  service:
    port: 80
  podSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

service:
  type: ClusterIP
  port: 8000

# PodDisruptionBudgets for the long-running Deployments, so a node drain or Karpenter
# consolidation can't evict every replica at once. Off by default. maxUnavailable: 1 never
# blocks a drain outright, even for the single-replica governor.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
  # Rendered only for components that are themselves rendered (web needs web.enabled).
  components:
    - api
    - web
    - worker
    - scanner-worker
    - governor

# NetworkPolicies. Off by default (they need a CNI that enforces them).
#   - Redis accepts connections only from this release's pods. The chart's Redis has no auth.
#   - The API accepts connections from this release's pods plus api.from (for example
#     your ingress controller's namespace). An empty api.from leaves the API reachable from
#     anywhere in the cluster.
#   - egress, when non-empty, restricts every Cryo pod's egress to DNS, this release's pods
#     and these rules: add your database, catalog, object storage and engine endpoints.
#     Empty leaves egress unrestricted.
networkPolicy:
  enabled: false
  api:
    from: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: ingress-nginx
  egress: []
  # - to:
  #     - ipBlock:
  #         cidr: 10.0.0.0/16
  #   ports:
  #     - port: 5432
  #       protocol: TCP
  #     - port: 443
  #       protocol: TCP
  # DNS egress allowed whenever egress is restricted.
  dnsPorts:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP

# Ingress in front of the web UI (which proxies /api to the API), or in front of the API
# when web.enabled is false. Off by default. Terminate TLS here or at your load balancer:
# sign-in passwords, Google ID tokens and session JWTs cross this hop.
# api.ingressAnnotations (SSE settings for the assistant) are merged in.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: cryo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: cryo-tls
  #   hosts:
  #     - cryo.example.com
