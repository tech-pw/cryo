# Prod overrides for the Cryo Helm chart. Applied on top of values.yaml:
#   helm upgrade --install cryo deploy/helm/cryo -n cryo -f deploy/helm/cryo/values.yaml -f deploy/helm/cryo/values-prod.yaml
#
# This targets the EXISTING `cryo` release/namespace on data-platform-cluster -- the cluster
# already verified reachable to internal.example.com:9083 (prod HMS) and the
# existing RDS `cryo` schema (data-engineering-db...), which already holds all 12,938 real
# tables scanned under the `cdp` source. Per the agreed three-environment split (#devops-data,
# 2026-07-13), this DB stays exclusively prod's -- nothing else should write to it.
#
# CRYO_ENVIRONMENT was live-set to "dev" on this deployment before the split was identified --
# this file corrects that.
#
# Stale note, corrected 2026-08-05: an earlier draft of this file described governor/
# scheduler/scannerWorker/worker as scaled to 0 (imperative `kubectl scale`, mid-migration to
# data-dev-eks) with this file's 1/1/8/2 replica counts as an intended-but-not-yet-applied
# revival. That's no longer accurate -- the write path has been live and running real
# maintenance jobs against the real fleet for the entirety of this session (verified directly:
# governor 1/1, scheduler 1/1, scannerWorker 8/8, worker 2/2, all running, real jobs completed).
# This file's replica counts already match observed live state; applying it reconciles Helm's
# managed state to reality, it does not revive anything dormant.
#
# Resource limits bumped from what's live today, matching what data-dev-eks needed at the same
# fleet scale (12,938 tables, 3.18M partitions, one outlier table at 397k partitions) earlier
# this session -- api 3Gi->6Gi (OOM history), scheduler 2Gi->6Gi + 1->2 cpu (OOM history, runs
# several daemon threads concurrently), scannerWorker 2Gi->3Gi (outlier-table headroom).
# scannerWorker replica count intentionally NOT dropped to 3 the way data-dev-eks's was --
# that reduction was justified by the new Go scan-stats engine (CRYO_SCAN_ENGINE=go) landing
# and needs its own verification against this cluster's real scan cadence before trusting fewer
# replicas here too.

image:
  repository: registry.example.com/cryo
  tag: latest
  # Built + pushed 2026-08-10 by user, from gitlab-main commit d408fed (on top of fe69b3f,
  # 0cdad5e, a6f1759, 78262a8).
  #
  # CORRECTION: the fe69b3f digest (sha256:9b6591558...) was pinned correctly for
  # migration.image and native.image below but NOT for this top-level image: digest in the
  # previous version of this file -- an editing mistake, not a build/push problem. That would
  # have meant api/worker/governor/scheduler pods ran fe69b3f-behind code while the native
  # engine binary (same image, different values.yaml key) ran fe69b3f. All three are back in
  # sync now, both because of this fix and because this whole file is being replaced with
  # today's newest digest anyway. This is exactly the class of mistake deploy.sh (see
  # deploy/deploy.sh) exists to make structurally impossible going forward -- one script,
  # one digest, three keys updated together, instead of three manual find-and-replace edits.
  #
  # -2. Fallback-dispatch outcomes now persisted (d408fed): _dispatch_fallback_operations()
  #     (the Governor's admission-time route to Spark for ops native can't run, e.g.
  #     optimize_manifests) already genuinely attempted the work -- its outcome only ever hit
  #     logger.info/logger.error. A job could show "succeeded" while its manifest
  #     consolidation silently failed, with zero persisted trace. Now recorded via the
  #     already-existing store.record_audit()/AuditRecord (has a manifests_rewritten field).
  #     Every exit path covered (success, failure, engine mismatch, missing config,
  #     unresolvable destination). See cryo/governor/native_admit.py.
  #
  # -1. Effectiveness reporting (fe69b3f): S3 bills per-request not per-byte, so a compaction
  #     that cuts file count 90% while barely moving bytes (confirmed live,
  #     mview.gold_dbt_drip_marketing_flow: 2,549 -> 268 files, size only -4%) is a large real
  #     cost win a byte-only summary would undersell. New `effectiveness` field on
  #     GET /tables/{id}/runs: file_count_reduction_pct, small_file_reduction_pct,
  #     byte_reduction_pct as independent signed percentages + a headline. Pure read-path
  #     addition, no behavior change. See cryo/db/repositories/datalake.py.
  #
  # 0. Failure-aware adaptive routing (0cdad5e): adaptive_routing's own size/capacity/
  #    latency/cost scoring had zero memory of failure history -- a table that failed on an
  #    engine 4 times in a row (unified_bq.gold_dbt_pw_bq, confirmed live) scored identically
  #    to one never tried. SQLSchedulerStore.consecutive_engine_failures() now feeds a per-
  #    table failure streak into rank_destinations(), which excludes (score -inf) a
  #    destination once it hits max_consecutive_failures_before_exclusion (default 2) on that
  #    table -- fails open if nothing else is available. Turned ON for default-native-deep via
  #    the preset API (guardrails.adaptive_routing=true, engine_pool scoped explicitly to
  #    [native-datafusion, spark-k8s-fallback] only -- Trino-Prod deliberately excluded, not
  #    an intended maintenance-dispatch target). See cryo/scheduler/adaptive_routing.py,
  #    cryo/scheduler/service.py, cryo/db/repositories/scheduler_store.py.
  #
  # 1. Backlog-aware expire_snapshots retention (78262a8): the existing streaming-aware
  #    retention tightening only reacts to *current* commits_per_day, missing tables that
  #    were bursty in the past or sit just under the is_streaming detection cutoff --
  #    confirmed live, admin.iceberg_maintenance_log at 22.15 commits/day vs a 24.0/day
  #    threshold, sitting on 499 snapshots, never flagged. Now also reacts to the raw
  #    accumulated total_snapshots count. total_snapshots/manifest_count are also now real
  #    filterable/rule-matchable fields (FIELD_MAP + _stats_dict), closing the gap that
  #    would otherwise have forced a hardcoded per-table pin list instead of a genuine
  #    condition-based rule. See cryo/planner/planner.py, cryo/api/predicates.py,
  #    cryo/domain/predicates.py, cryo/db/repositories/presets.py.
  #
  # 2. Property autopilot (a6f1759): layout_analyzer already generates real property
  #    recommendations automatically on a schedule, and apply_table_properties() already
  #    executes them via PyIceberg -- but nothing had ever connected the two; the only
  #    caller of apply_table_properties() was a human clicking a button. See
  #    cryo/scanner/property_autopilot.py. Narrowly scoped to tier1/action=="apply"/
  #    not-needs_confirmation items only (metadata-only properties, never a data rewrite);
  #    apply_table_properties()'s own TIER1_APPLYABLE_KEYS allowlist is the actual safety
  #    boundary, checked independently. Shipped OFF in this digest; turned ON 2026-08-10 via
  #    global.env.CRYO_PROPERTY_AUTOPILOT_ENABLED below, by request -- see that env var's own
  #    comment for the rollback note.
  digest: "sha256:e4ee6c0475f0bb69c12a51f656bf0418a9dc69fdfdefe2afecc50e54610784ba"

imagePullSecrets:
  - cryo-registry

migration:
  image:
    repository: registry.example.com/cryo
    tag: latest
    digest: "sha256:e4ee6c0475f0bb69c12a51f656bf0418a9dc69fdfdefe2afecc50e54610784ba"

global:
  envFromSecret: cryo-secrets
  env:
    CRYO_ENVIRONMENT: prod
    CRYO_SCAN_ENGINE: go
    CRYO_S3_LOG_TRINO_CATALOG: cdp
    # internal.example.com uses a self-signed/internal-CA cert.
    CRYO_TELEMETRY_TRINO_SSL_VERIFY: "false"
    # User-requested, 2026-08-12: a hard $100/day ceiling on the cryo namespace's own
    # used+unused spend after real data showed it averaging $210.82/day over the
    # trailing 14 days. Requires CRYO_GRAFANA_TOKEN (see cryo-secrets, added manually
    # 2026-08-12 -- not chart-managed, rotate via `kubectl patch secret cryo-secrets`).
    # See cryo/reporting/cost_ceiling.py.
    CRYO_COST_CEILING_ENABLED: "true"
    # Explicit, deliberate bridge until real OIDC (CRYO_OIDC_ISSUER_URL/CLIENT_ID) is
    # configured -- re-enables the dev sign-in form (self-declared role, no real identity
    # check) even though environment=='prod'. See cryo/api/auth_routes.py::_dev_token_enabled.
    # Anyone reaching the UI can self-grant any role while this is true.
    #
    # Re-enabled 2026-08-05: briefly turned off in the same deploy that shipped this comment,
    # which (correctly, per this comment's own warning) locked every human out of the web UI
    # since OIDC was never configured -- turned back on as an explicit, deliberate choice to
    # keep UI access working, not an oversight. Turn off again once real OIDC
    # (CRYO_OIDC_ISSUER_URL/CRYO_OIDC_CLIENT_ID) is actually configured -- see
    # docs/deployment.md or ask before flipping this back off, since it will re-lock the UI.
    CRYO_ALLOW_DEV_TOKEN_IN_PROD: "true"

    # Disabled 2026-09-17, live-confirmed incident: the native (iceberg-go) engine has no
    # independent verification that its own self-reported success actually mutated the
    # Iceberg table (gold_dbt_poll_dashboard_view ran 25min, reported success on every
    # operation, committed zero snapshots -- see cryo/engines/native/watcher.py's
    # _reported_zero_work_operations). native.enabled (Helm-level: whether K8s-dispatch
    # RBAC/templates render for the Governor's native-Job-per-table path) and this Python
    # setting (whether the Worker's legacy dispatch path can construct a NativeEngine at all,
    # cryo/engines/factory.py::create_engine) are two independent gates -- native.enabled=true
    # above only controls the former, so this env var is required on top of it to actually stop
    # every native-engine job across both dispatch paths. Every operation now reroutes to each
    # destination's configured sql_fallback_destination_id (Spark/Trino) instead -- see
    # cryo/engines/native/routing.py's resolve_native_routing for the fallback mechanism.
    # Re-confirmed live the same day this was added: before this var existed, deploying the new
    # zero-work detection (cryo_fix.md item 3) alone made every genuinely-broken native job that
    # used to silently "succeed" start failing loudly instead (254 native_job_reported_success_
    # with_zero_work failures in under an hour) -- the detection was correct, but native jobs
    # were still being dispatched at all because this flag was never wired in. Do not remove
    # until the native engine's own success verification is independently trustworthy again.
    CRYO_NATIVE_ENGINE_ENABLED: "false"

    # Turned on 2026-08-10, by request, the deliberate follow-up promised in the digest
    # changelog above (a6f1759 / property_autopilot.py). Scheduler's telemetry tick now
    # auto-applies tier1/action=apply/not-needs_confirmation property recommendations
    # (metadata-only PyIceberg ALTER TABLE calls -- write.target-file-size-bytes,
    # write.metadata.delete-after-commit.enabled, etc; never a data rewrite, never sort-order).
    # apply_table_properties()'s own TIER1_APPLYABLE_KEYS allowlist remains the independent
    # safety boundary regardless of this flag. Bounded to
    # property_autopilot_max_tables_per_tick (default 100) tables/tick. Watch
    # admin.iceberg_maintenance_log / audit records for cryo-property-autopilot actor after
    # this rolls out, and roll back by removing this line if anything looks wrong.
    CRYO_PROPERTY_AUTOPILOT_ENABLED: "true"

    # Turned on 2026-08-11, during a full-system audit ("is Cryo running at its full
    # potential") that found this ROI-based admission gate fully built (cryo/governor/
    # governor.py, cryo/api/routes_smart_maintenance.py) but never turned on. Safe to enable
    # on its own: roi_gate_shadow_mode defaults to "true" (NOT overridden here), and while
    # shadow, the gate only logs its benefit-cost-ratio decision per job ("ROI gate shadow:
    # job ... action=... bcr=... threshold=...") -- it never skips or defers a real job. Only
    # flip CRYO_ROI_GATE_SHADOW_MODE=false, separately and deliberately, once the shadow logs
    # have been reviewed and the BCR thresholds (roi_min_bcr / roi_min_bcr_streaming) look
    # right for this fleet.
    CRYO_ROI_GATE_ENABLED: "true"

# Enabled 2026-07-29 (see cost-driven-autoscaling plan, #devops-data): turns on the
# already-built Governor -> sized-per-table K8s Job dispatch path for maintenance jobs
# (rewrite/expire/orphan), replacing static always-on Worker capacity with ephemeral,
# resource-sized Jobs. KEDA + Karpenter CRDs confirmed already installed on this cluster.
# native.spot.allow stays false (inherited from values.yaml) until the on-demand path is
# proven -- do not flip that here without validating spot checkpointing first.
# Rollout is deliberately staged per-destination: the one live destination with
# k8s_dispatch=true (native-datafusion) had its slot_cap dropped 5->1 in the DB before this
# was applied, so the first dispatch is a single job to watch closely, not a burst of 5.
native:
  enabled: true
  # The native engine binary ships inside the same main image (engine-go build stage in the
  # root Dockerfile) -- not a separate image. Same repo/tag/digest as `image:` above.
  image:
    repository: registry.example.com/cryo
    tag: latest
    digest: "sha256:e4ee6c0475f0bb69c12a51f656bf0418a9dc69fdfdefe2afecc50e54610784ba"
  keda:
    enabled: true
    # Stopgap maxReplicas: 3 removed 2026-09-10 after the real root cause was found and
    # fixed: refresh_cost_model_cache() was running inline on every job completion, on
    # every worker pod (see cryo/worker/worker.py and cryo/cli.py's CostModelRefreshRunner,
    # digest sha256:25dcfa32, commit 39f8123f) -- confirmed live via kernel-level /proc/1/
    # smaps_rollup and independently reproduced by OOMKilling a cryo-api pod via one call to
    # /api/v1/ai/cost-model/evaluate (same code path). Post-fix soak: 12+ min, 0 restarts,
    # lastState={} on every pod (vs. 40-90s pre-fix, 11-14min on the intermediate partial
    # fix). Back to the template default (10) -- the earlier maxReplicas: 3 cap was a
    # concurrency-reduction stopgap that slowed admission throughput fleet-wide, not a fix.

# Enabled 2026-07-29 for a controlled prod test (see cost-driven-autoscaling plan): the
# always-on 8-replica scannerWorker Deployment is temporarily scaled to 0 for the duration
# of this test only (see rollout notes) so the new Governor-driven per-chunk dispatch has
# an uncontested claim -- restore scannerWorker.replicas before leaving this enabled
# long-term, or the two paths just race for the same queue (harmless, but pointless).
scanner:
  jobDispatch:
    enabled: true
    batchSize: 1

# Replaced every maintenance preset on 2026-09-24 (all 33 deleted; backup outside the repo).
# One nightly run of the top 500 tables on at most 4 local-mode Spark pods, in place of one
# spark-submit wrapper + driver + executors per SQL statement (~35k driver pods in 8 days).
maintenance:
  enabled: true

api:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      # Lowered 768Mi -> 256Mi 2026-08-16: confirmed live, both cryo-api pods steady at
      # ~136Mi actual usage (0 restarts, ever) -- 768Mi was reserving ~82% unused memory
      # per the cryo-namespace cost dashboard. 256Mi keeps ~2x headroom over observed
      # usage; limit is untouched (6Gi) so a real spike still has room before OOM.
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 6Gi

worker:
  # This is only the baseline Helm sets on each deploy -- keda-hpa-cryo-worker (KEDA
  # ScaledObject cryo-worker, deploy/helm/cryo/templates/keda-worker-scaledobject.yaml)
  # immediately takes over live scaling 1-10 on admitted+running job count, same as any
  # Deployment behind an HPA. Live replica count was 10/10 (at the max) when this comment
  # was added 2026-09-03 -- don't read this "2" as the real fleet size; check `kubectl get
  # hpa -n cryo` for that.
  replicas: 2
  resources:
    requests:
      # Lowered 500m -> 100m 2026-09-03: confirmed live across all 10 KEDA-scaled replicas
      # (keda-hpa-cryo-worker, deploy/helm/cryo/templates/keda-worker-scaledobject.yaml,
      # scales 1-10 on admitted+running job count), steady at ~23m actual usage average --
      # 500m was reserving ~95% unused CPU per the cryo-namespace cost dashboard
      # (namespace_unused_cost vitals check: $111 unused vs $44 used, 2.6x, 2026-09-02).
      # 100m keeps ~4x headroom over observed usage.
      cpu: 100m
      # Lowered 1Gi -> 256Mi 2026-09-03: same investigation, memory steady at ~137Mi actual
      # usage across all 10 replicas (0 restarts) -- 1Gi was reserving ~86% unused memory.
      # 256Mi keeps ~2x headroom over observed usage; limit below is untouched so a real
      # spike still has room before OOM (see the 2026-08-16 OOM note this raise predates).
      memory: 256Mi
    limits:
      cpu: "2"
      # Raised 4Gi -> 6Gi 2026-08-16: confirmed live, several cryo-worker pods OOMKilled
      # 46-77x each in an ~8.5-11.5h-old burst window, same "Created Spark-on-K8s dispatch
      # Job ... Deleted Spark driver pod" signature as the 2026-08-14 OOM investigation
      # (see cryo/engines/spark/k8s.py's module-level client caching fix from that date).
      # That fix is confirmed live on the running image and its own code path looks clean
      # on review -- this is very likely genuine concurrent-dispatch memory pressure (up to
      # _DEFAULT_FALLBACK_DISPATCH_CONCURRENCY=6 concurrent Spark-K8s submissions per table
      # admission wave), not a new client-object leak, but there's no time-series data from
      # the actual burst to confirm that precisely. This bump is a safety margin, not a
      # confirmed root-cause fix -- see the new per-dispatch memory logging in
      # native_admit.py, added the same day, for real data next time this recurs.
      #
      # Recurred, 2026-09-10: same signature again -- turned out to be three compounding
      # bugs, not one. (1) recover_orphaned_jobs' fallback loop called list_queued_jobs()
      # with no limit (fixed, cryo/worker/orphan_recovery.py) -- reduced but did not
      # eliminate the cascade. (2) list_running_jobs()/list_admitted_jobs() were also
      # unbounded, called every 5s on every worker pod (fixed, same file + cryo/db/
      # repositories/job_store.py) -- reduced further (40-90s -> 11-14min to OOM) but still
      # not flat. (3) THE ACTUAL ROOT CAUSE: refresh_cost_model_cache() ran inline,
      # unconditionally, on every single job completion, on every worker pod -- confirmed
      # via kernel-level /proc/1/smaps_rollup (Anonymous heap climbing ~1GB per ~6-10s,
      # always starting the instant a job's last operation finished) and independently
      # reproduced by OOMKilling a cryo-api pod via one call to /api/v1/ai/cost-model/
      # evaluate (same build_outcome_dataset code path -- QueryLog/TableStatsHistory/
      # TableCostHistory/QueryCostAttributionDaily over a 90-day window). Moved to a
      # periodic CostModelRefreshRunner daemon (cryo/cli.py, commit 39f8123f, digest
      # sha256:25dcfa32). Post-fix soak: 28+ min, 0 restarts, lastState={} across a 9-pod
      # fleet after also reverting the maxReplicas:3 stopgap. Reverted back to 6Gi --
      # the 8Gi bump (like the 6Gi bump before it) was a safety margin for a leak that no
      # longer exists, not a genuine steady-state requirement (worker RSS is ~140-170Mi in
      # normal operation, confirmed repeatedly live throughout this investigation).
      memory: 6Gi

governor:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      # Lowered 1Gi -> 384Mi 2026-08-16: confirmed live, actual usage steady at ~178Mi
      # (0 restarts, ever) -- 1Gi was reserving ~83% unused memory per the cryo-namespace
      # cost dashboard. 384Mi keeps ~2x headroom over observed usage; the limit below is
      # untouched (already raised 1Gi->3Gi 2026-08-03 for a real OOM under queue-depth
      # load, unrelated to this request-sizing change) so a real spike still has room.
      memory: 384Mi
    limits:
      cpu: "1"
      # Raised 1Gi -> 3Gi 2026-08-03: OOMKilled 22x in ~3h once a single destination's queue
      # depth hit 11k+ jobs -- the admission tick's per-table resource-predictor calls scale
      # with queue size and blew the old limit. Stop-gap; the real fix is bounding the
      # per-tick admission scan, tracked separately.
      memory: 3Gi

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      # Raised 512Mi -> 3Gi, 2026-09-18: real root cause of a recurring OOM/eviction pattern
      # (this incident and the 2026-08-25 one below) that the repeated limit-only raises never
      # actually fixed -- this is a Karpenter-autoscaled cluster, and Karpenter provisions/
      # sizes nodes against a pod's REQUEST, not its limit. With request stuck at 512Mi while
      # the limit climbed to 10Gi, the scheduler kept landing on small nodes sized for ~512Mi
      # of actual demand (confirmed live: ip-10-1-221-71, 8003280Ki capacity / 6474448Ki
      # allocatable -- smaller than the pod's own 10Gi limit) whose neighbors + node-level
      # kubelet eviction thresholds kicked in long before the scheduler ever reached its own
      # cgroup limit. Two consecutive pods on that exact node were evicted at ~6.0GB usage
      # ("The node was low on resource: memory... Container scheduler was using 6021228Ki") --
      # well under the 10Gi cgroup limit, proving the limit was never the binding constraint.
      # Raising the request (not just the limit) is what actually changes which node Karpenter
      # picks. 3Gi matches this incident's own observed ~2-6GB steady-state range with headroom
      # short of triggering the next size tier unnecessarily when idle.
      memory: 3Gi
    limits:
      cpu: "2"
      # Raised 6Gi -> 10Gi 2026-08-25: OOMKilled 9x in 15h (exit 137), confirmed live via
      # kubectl describe. Same root shape as the 2Gi->6Gi raise noted above (benefit_score.py's
      # update_all_benefit_scores, run every benefit_score_update_interval_hours) -- that fix's
      # own comment already flagged 1.27M partitions as the trigger and added session.expunge_all()
      # per table to stop the SQLAlchemy identity map from holding every Table/TablePartition
      # object live for the whole sweep; the fleet has since grown to 1.56M+ partitions processed
      # per sweep (confirmed live in the crashing pod's own logs: "Updated benefit scores for
      # 1556325 partitions in 5932.5s" immediately preceding the OOM), past the headroom that fix
      # bought. Each restart re-starts the full ~99min sweep from scratch rather than resuming, so
      # the crash-loop was actively costing scheduling throughput, not just restarting harmlessly --
      # confirmed live: north-star GB-freed/day fell 1,443.7 (Aug 23) -> 308.9 (Aug 24, -78.6%) over
      # the same window this started. Cluster has ample headroom for this (nodes at 5-40% memory
      # utilization, kubectl top nodes) -- stop-gap like the 1Gi->3Gi/2Gi->6Gi raises before it; the
      # real fix (bounding update_all_benefit_scores' peak memory instead of just raising the
      # ceiling to match it) is a separate, larger change, not done here.
      #
      # 2026-09-18 addendum: this limit-only fix was incomplete on its own -- see the request
      # comment above for why raising only the limit never actually fixed the underlying
      # eviction pattern on a Karpenter-autoscaled cluster.
      memory: 10Gi

scannerWorker:
  # Demand-based KEDA now replaces the historical HPA described below, and as of 2026-09-22
  # it scales all the way to zero. The previous floor of 1 existed only because the KEDA
  # trigger polled the scanner-worker's own Service, so one pod had to stay up to answer
  # "should there be any pods?" -- a circular dependency, not a workload requirement. The
  # trigger now polls the API instead (see keda-scanner-worker-scaledobject.yaml), which is
  # always up and is where ad-hoc scans originate, so the floor could go.
  #
  # Measured before making the change: ScaledObject ACTIVE=False, HPA target 0/1, the single
  # pod at 1m CPU / 117Mi against requests of 500m / 256Mi, and no non-cron scan trigger in
  # the runs table since 2026-08-25 -- 28 days of a reserved pod doing nothing.
  #
  # `replicas: 8` was a fixed floor, not a target -- provisioned for this fleet's largest
  # observed scan burst (12,938 tables, one 397k-partition outlier) and left running at
  # that size continuously, because the base chart's default of 3 (see values.yaml,
  # justified by the Go scan-stats engine's lower peak RSS) hadn't been verified safe on
  # this specific cluster yet. CRYO_SCAN_ENGINE=go (global.env) has been live here the
  # whole time, so that verification gap was already closed in practice -- but rather than
  # just drop the number and re-trust a single fixed value, autoscale between the two:
  # minReplicas 3 (the already-justified floor) to maxReplicas 8 (today's provisioned
  # ceiling, so this can't burst past what's already proven to handle this fleet without a
  # separate capacity review). Confirmed live, 2026-08-12: this fixed-8 configuration was
  # ~73% "unused cost" on the cryo-namespace cost dashboard -- the ad-hoc scan queue
  # (cryo:scan:pending) these pods consume is empty most of the time between bursts.
  replicas: 8
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 8
    keda:
      enabled: true
      minReplicas: 0
      maxReplicas: 8
      targetValue: "1"
  resources:
    requests:
      cpu: 500m
      # Lowered 512Mi -> 256Mi 2026-08-16: confirmed live, all 3 pods steady at ~103Mi
      # actual usage (0 restarts, ever) -- consistent with this section's own 2026-08-12
      # note above that the fixed-8-replica configuration ran ~73% unused on the
      # cryo-namespace cost dashboard. 256Mi keeps ~2.5x headroom over observed usage;
      # limit untouched (3Gi) for scan-burst headroom.
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 3Gi

web:
  enabled: true
  replicas: 2
  image:
    repository: registry.example.com/cryo
    tag: web-latest
    # Built + pushed 2026-08-19 from gitlab-main commit 294657a -- adds the Partition Access
    # scatter chart (Table Detail -> Structure, docs/PARTITION_ACCESS_VISUALIZATION_PLAN_2026-08.md)
    # and the Iceberg Maintenance Intelligence RFC's UI (Health page "Recently discovered"
    # card, Table Detail Overview fast-path banner, partition-evolution scan-ratio/trigger
    # copy -- docs/ICEBERG_MAINTENANCE_INTELLIGENCE_RFC.md). Still a manual build+push --
    # deploy/deploy.sh does not build this image, only the backend's.
    digest: "sha256:97d30d985afd977e799a5d04c7c963b52dcb262e03c2402c4ad25c219f0a3304"
  # Lowered 128Mi (the base chart's values.yaml default, unset here before now) -> 64Mi
  # 2026-08-16: confirmed live, both cryo-web pods (a static nginx serve, not a Python
  # process) steady at 7-24Mi actual usage, 0 restarts ever. Overridden here rather than
  # in values.yaml since that default is shared across every deployment of this chart,
  # not just this cluster's confirmed-safe number.
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

spark:
  # Live on data-platform-cluster as of 2026-07-21 (helm upgrade revision 40) as the SQL
  # fallback destination for ops the native (iceberg-go) engine can't run itself -- see
  # cryo/engines/spark/k8s.py and native_admit.py::_dispatch_fallback_operations.
  k8s:
    enabled: true
    image:
      repository: registry.example.com/cryo
      tag: spark-batch-2026-09-24
      # Built + pushed 2026-09-24 (multi-arch): adds cryo_spark_runner.py --manifest, the
      # batch-maintenance lane mode. The --sql mode the old per-statement path uses is
      # unchanged. Previous: sha256:7c508fbb... (2026-08-05, commit eee1788).
      digest: "sha256:8781e9a945981676a19f573dccfefff24555f4f3c5afba18e36a5cf2583ef751"
      pullPolicy: Always
    # Right-sized 2026-08-06 from real usage sampled via `kubectl top` on ~15 live
    # dispatch pods while the manifest-fix rollout was running: driver averaged
    # 58-100m CPU / 541-552Mi mem, executors averaged 2-409m CPU / 287-301Mi mem --
    # against the prior 1000m/2048Mi driver and 2000m/4096Mi-per-executor requests,
    # i.e. ~6-15% memory utilization and ~5-20% CPU utilization. This was the
    # dominant driver of the cryo namespace's AWS EKS split-cost "unused_cost"
    # (87.9% of a $1,412/30d untagged-workload bucket, confirmed via the CUR `cur`
    # table -- ephemeral Jobs don't carry eks:workload-name tags, so this cost was
    # invisible in the normal per-Deployment cost breakdown). Halved on the
    # CPU dimension (worst case is throttling, not a crash) and cut with more
    # margin on memory (worst case is OOMKill) -- still ~2x observed peak on both,
    # not cut to the observed average. If real optimize_manifests OOMs start
    # showing up, raise executorMemMib first; that's the one with the least slack.
    # PDAE-8544: Jobs still omit AWS-generated aws:eks:workload-name; native + Spark
    # pods now set eks-workload-name / eks-workload-type / cryo-engine / cryo-operation.
    # Activate those user tags; Athena: resource_tags_user_eks_workload_name.
    driverCpuMilli: 500
    driverMemMib: 1024
    executorCpuMilli: 1000
    executorMemMib: 2048
    executorInstances: 2
    activeDeadlineSeconds: 7200
    ttlSecondsAfterFinished: 3600

redis:
