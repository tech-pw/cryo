# Prod overrides for the Cryo Helm chart. Applied on top of values.yaml:
#   helm upgrade --install cryo deploy/helm/cryo -n cryo -f deploy/helm/cryo/values.yaml -f deploy/helm/cryo/values-prod.yaml
#
# This targets the EXISTING `cryo` release/namespace on data-platform-cluster -- the cluster
# already verified reachable to internal.example.com:9083 (prod HMS) and the
# existing RDS `cryo` schema (data-engineering-db...), which already holds all 12,938 real
# tables scanned under the `cdp` source. Per the agreed three-environment split (#devops-data,
# 2026-07-13), this DB stays exclusively prod's -- nothing else should write to it.
#
# CRYO_ENVIRONMENT was live-set to "dev" on this deployment before the split was identified --
# this file corrects that.
#
# governor/scheduler/scannerWorker/worker are currently scaled to 0 replicas on the live
# deployment (imperative `kubectl scale`, done mid-migration to data-dev-eks -- see prior
# session notes) even though Helm's own values still say 1/1/8/2. This file's replica counts
# below are the INTENDED state once revived -- applying this file will bring those daemons back
# up. Do not apply until explicitly confirmed; reviving the write-path here means real
# maintenance jobs will start firing against the real fleet again.
#
# Resource limits bumped from what's live today, matching what data-dev-eks needed at the same
# fleet scale (12,938 tables, 3.18M partitions, one outlier table at 397k partitions) earlier
# this session -- api 3Gi->6Gi (OOM history), scheduler 2Gi->6Gi + 1->2 cpu (OOM history, runs
# several daemon threads concurrently), scannerWorker 2Gi->3Gi (outlier-table headroom).
# scannerWorker replica count intentionally NOT dropped to 3 the way data-dev-eks's was --
# that reduction was justified by the new Go scan-stats engine (CRYO_SCAN_ENGINE=go) landing
# and needs its own verification against this cluster's real scan cadence before trusting fewer
# replicas here too.

image:
  repository: registry.example.com/cryo
  tag: latest

imagePullSecrets:
  - cryo-registry

migration:
  image:
    repository: registry.example.com/cryo
    tag: latest

global:
  envFromSecret: cryo-secrets
  env:
    CRYO_ENVIRONMENT: prod
    CRYO_SCAN_ENGINE: go
    CRYO_S3_LOG_TRINO_CATALOG: cdp
    # internal.example.com uses a self-signed/internal-CA cert.
    CRYO_TELEMETRY_TRINO_SSL_VERIFY: "false"
    # Explicit, deliberate bridge until real OIDC (CRYO_OIDC_ISSUER_URL/CLIENT_ID) is
    # configured -- re-enables the dev sign-in form (self-declared role, no real identity
    # check) even though environment=='prod'. See cryo/api/auth_routes.py::_dev_token_enabled.
    # Anyone reaching the UI can self-grant any role while this is true -- turn off once OIDC
    # is set up.
    CRYO_ALLOW_DEV_TOKEN_IN_PROD: "true"

api:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 6Gi

worker:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

governor:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      # Raised 1Gi -> 3Gi 2026-08-03: OOMKilled 22x in ~3h once a single destination's queue
      # depth hit 11k+ jobs -- the admission tick's per-table resource-predictor calls scale
      # with queue size and blew the old limit. Stop-gap; the real fix is bounding the
      # per-tick admission scan, tracked separately.
      memory: 3Gi

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 6Gi

scannerWorker:
  replicas: 8
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 3Gi

web:
  enabled: true
  replicas: 2
  image:
    repository: registry.example.com/cryo
    tag: web-latest

spark:
  # Live on data-platform-cluster as of 2026-07-21 (helm upgrade revision 40) as the SQL
  # fallback destination for ops the native (iceberg-go) engine can't run itself -- see
  # cryo/engines/spark/k8s.py and native_admit.py::_dispatch_fallback_operations.
  k8s:
    enabled: true
    image:
      repository: registry.example.com/cryo
      tag: spark-latest
      pullPolicy: Always
    driverCpuMilli: 1000
    driverMemMib: 2048
    executorCpuMilli: 2000
    executorMemMib: 4096
    executorInstances: 2
    activeDeadlineSeconds: 7200
    ttlSecondsAfterFinished: 3600
