# Prod overrides for the Cryo Helm chart. Applied on top of values.yaml:
#   helm upgrade --install cryo deploy/helm/cryo -n cryo -f deploy/helm/cryo/values.yaml -f deploy/helm/cryo/values-prod.yaml
#
# This targets the EXISTING `cryo` release/namespace on data-platform-cluster -- the cluster
# already verified reachable to internal.example.com:9083 (prod HMS) and the
# existing RDS `cryo` schema (data-engineering-db...), which already holds all 12,938 real
# tables scanned under the `cdp` source. Per the agreed three-environment split (#devops-data,
# 2026-07-13), this DB stays exclusively prod's -- nothing else should write to it.
#
# CRYO_ENVIRONMENT was live-set to "dev" on this deployment before the split was identified --
# this file corrects that.
#
# Stale note, corrected 2026-08-05: an earlier draft of this file described governor/
# scheduler/scannerWorker/worker as scaled to 0 (imperative `kubectl scale`, mid-migration to
# data-dev-eks) with this file's 1/1/8/2 replica counts as an intended-but-not-yet-applied
# revival. That's no longer accurate -- the write path has been live and running real
# maintenance jobs against the real fleet for the entirety of this session (verified directly:
# governor 1/1, scheduler 1/1, scannerWorker 8/8, worker 2/2, all running, real jobs completed).
# This file's replica counts already match observed live state; applying it reconciles Helm's
# managed state to reality, it does not revive anything dormant.
#
# Resource limits bumped from what's live today, matching what data-dev-eks needed at the same
# fleet scale (12,938 tables, 3.18M partitions, one outlier table at 397k partitions) earlier
# this session -- api 3Gi->6Gi (OOM history), scheduler 2Gi->6Gi + 1->2 cpu (OOM history, runs
# several daemon threads concurrently), scannerWorker 2Gi->3Gi (outlier-table headroom).
# scannerWorker replica count intentionally NOT dropped to 3 the way data-dev-eks's was --
# that reduction was justified by the new Go scan-stats engine (CRYO_SCAN_ENGINE=go) landing
# and needs its own verification against this cluster's real scan cadence before trusting fewer
# replicas here too.

image:
  repository: registry.example.com/cryo
  tag: latest
  # Built + pushed 2026-08-10 from gitlab-main commit a6f1759 (on top of 78262a8). Includes
  # everything in the prior digest plus two changes:
  #
  # 1. Backlog-aware expire_snapshots retention (78262a8): the existing streaming-aware
  #    retention tightening only reacts to *current* commits_per_day, missing tables that
  #    were bursty in the past or sit just under the is_streaming detection cutoff --
  #    confirmed live, admin.iceberg_maintenance_log at 22.15 commits/day vs a 24.0/day
  #    threshold, sitting on 499 snapshots, never flagged. Now also reacts to the raw
  #    accumulated total_snapshots count. total_snapshots/manifest_count are also now real
  #    filterable/rule-matchable fields (FIELD_MAP + _stats_dict), closing the gap that
  #    would otherwise have forced a hardcoded per-table pin list instead of a genuine
  #    condition-based rule. See cryo/planner/planner.py, cryo/api/predicates.py,
  #    cryo/domain/predicates.py, cryo/db/repositories/presets.py.
  #
  # 2. Property autopilot (a6f1759): layout_analyzer already generates real property
  #    recommendations automatically on a schedule, and apply_table_properties() already
  #    executes them via PyIceberg -- but nothing had ever connected the two; the only
  #    caller of apply_table_properties() was a human clicking a button. See
  #    cryo/scanner/property_autopilot.py. Narrowly scoped to tier1/action=="apply"/
  #    not-needs_confirmation items only (metadata-only properties, never a data rewrite);
  #    apply_table_properties()'s own TIER1_APPLYABLE_KEYS allowlist is the actual safety
  #    boundary, checked independently. OFF BY DEFAULT (property_autopilot_enabled=false
  #    in Settings) -- this digest ships the capability, not the behavior; it does nothing
  #    unless/until CRYO_PROPERTY_AUTOPILOT_ENABLED=true is deliberately added to this
  #    file's global.env in a future, separate change -- not set here.
  digest: "sha256:ea3f2b3ddef50f74a5af64e78aed5fd786920d706a24e8d0aaf2ea6e2b05aaa9"

imagePullSecrets:
  - cryo-registry

migration:
  image:
    repository: registry.example.com/cryo
    tag: latest
    digest: "sha256:ea3f2b3ddef50f74a5af64e78aed5fd786920d706a24e8d0aaf2ea6e2b05aaa9"

global:
  envFromSecret: cryo-secrets
  env:
    CRYO_ENVIRONMENT: prod
    CRYO_SCAN_ENGINE: go
    CRYO_S3_LOG_TRINO_CATALOG: cdp
    # internal.example.com uses a self-signed/internal-CA cert.
    CRYO_TELEMETRY_TRINO_SSL_VERIFY: "false"
    # Explicit, deliberate bridge until real OIDC (CRYO_OIDC_ISSUER_URL/CLIENT_ID) is
    # configured -- re-enables the dev sign-in form (self-declared role, no real identity
    # check) even though environment=='prod'. See cryo/api/auth_routes.py::_dev_token_enabled.
    # Anyone reaching the UI can self-grant any role while this is true.
    #
    # Re-enabled 2026-08-05: briefly turned off in the same deploy that shipped this comment,
    # which (correctly, per this comment's own warning) locked every human out of the web UI
    # since OIDC was never configured -- turned back on as an explicit, deliberate choice to
    # keep UI access working, not an oversight. Turn off again once real OIDC
    # (CRYO_OIDC_ISSUER_URL/CRYO_OIDC_CLIENT_ID) is actually configured -- see
    # docs/deployment.md or ask before flipping this back off, since it will re-lock the UI.
    CRYO_ALLOW_DEV_TOKEN_IN_PROD: "true"

# Enabled 2026-07-29 (see cost-driven-autoscaling plan, #devops-data): turns on the
# already-built Governor -> sized-per-table K8s Job dispatch path for maintenance jobs
# (rewrite/expire/orphan), replacing static always-on Worker capacity with ephemeral,
# resource-sized Jobs. KEDA + Karpenter CRDs confirmed already installed on this cluster.
# native.spot.allow stays false (inherited from values.yaml) until the on-demand path is
# proven -- do not flip that here without validating spot checkpointing first.
# Rollout is deliberately staged per-destination: the one live destination with
# k8s_dispatch=true (native-datafusion) had its slot_cap dropped 5->1 in the DB before this
# was applied, so the first dispatch is a single job to watch closely, not a burst of 5.
native:
  enabled: true
  # The native engine binary ships inside the same main image (engine-go build stage in the
  # root Dockerfile) -- not a separate image. Same repo/tag/digest as `image:` above.
  image:
    repository: registry.example.com/cryo
    tag: latest
    digest: "sha256:ea3f2b3ddef50f74a5af64e78aed5fd786920d706a24e8d0aaf2ea6e2b05aaa9"
  keda:
    enabled: true

# Enabled 2026-07-29 for a controlled prod test (see cost-driven-autoscaling plan): the
# always-on 8-replica scannerWorker Deployment is temporarily scaled to 0 for the duration
# of this test only (see rollout notes) so the new Governor-driven per-chunk dispatch has
# an uncontested claim -- restore scannerWorker.replicas before leaving this enabled
# long-term, or the two paths just race for the same queue (harmless, but pointless).
scanner:
  jobDispatch:
    enabled: true
    batchSize: 1

api:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 6Gi

worker:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

governor:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      # Raised 1Gi -> 3Gi 2026-08-03: OOMKilled 22x in ~3h once a single destination's queue
      # depth hit 11k+ jobs -- the admission tick's per-table resource-predictor calls scale
      # with queue size and blew the old limit. Stop-gap; the real fix is bounding the
      # per-tick admission scan, tracked separately.
      memory: 3Gi

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 6Gi

scannerWorker:
  replicas: 8
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 3Gi

web:
  enabled: true
  replicas: 2
  image:
    repository: registry.example.com/cryo
    tag: web-latest
    # Built + pushed 2026-08-05 from gitlab-main commit e5ac5a5.
    digest: "sha256:0edbcd9bdeb65c0311a1732d6577be87a78e258f3e09b3b217e658f1aaba5872"

spark:
  # Live on data-platform-cluster as of 2026-07-21 (helm upgrade revision 40) as the SQL
  # fallback destination for ops the native (iceberg-go) engine can't run itself -- see
  # cryo/engines/spark/k8s.py and native_admit.py::_dispatch_fallback_operations.
  k8s:
    enabled: true
    image:
      repository: registry.example.com/cryo
      tag: spark-latest
      # Built + pushed 2026-08-05 from gitlab-main commit eee1788.
      digest: "sha256:7c508fbb330b5af493187c58c20c3180f9dd173ecd25f32c5ea6e528da3bf7fb"
      pullPolicy: Always
    # Right-sized 2026-08-06 from real usage sampled via `kubectl top` on ~15 live
    # dispatch pods while the manifest-fix rollout was running: driver averaged
    # 58-100m CPU / 541-552Mi mem, executors averaged 2-409m CPU / 287-301Mi mem --
    # against the prior 1000m/2048Mi driver and 2000m/4096Mi-per-executor requests,
    # i.e. ~6-15% memory utilization and ~5-20% CPU utilization. This was the
    # dominant driver of the cryo namespace's AWS EKS split-cost "unused_cost"
    # (87.9% of a $1,412/30d untagged-workload bucket, confirmed via the CUR `cur`
    # table -- ephemeral Jobs don't carry eks:workload-name tags, so this cost was
    # invisible in the normal per-Deployment cost breakdown). Halved on the
    # CPU dimension (worst case is throttling, not a crash) and cut with more
    # margin on memory (worst case is OOMKill) -- still ~2x observed peak on both,
    # not cut to the observed average. If real optimize_manifests OOMs start
    # showing up, raise executorMemMib first; that's the one with the least slack.
    driverCpuMilli: 500
    driverMemMib: 1024
    executorCpuMilli: 1000
    executorMemMib: 2048
    executorInstances: 2
    activeDeadlineSeconds: 7200
    ttlSecondsAfterFinished: 3600

redis:
  image:
    # Pinned 2026-08-05, upstream redis:7-alpine manifest-list digest at time of deploy.
    digest: "sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2"
