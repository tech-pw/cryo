{{- /*
The ServiceAccount every Cryo pod runs as.

Exists because the component SAs (native, governor, spark, analysis) are only created
when those features are enabled, so a default install had pods referencing a
ServiceAccount that was never rendered -- Kubernetes silently falls back to `default`,
which carries no IRSA role. On EKS that means Cryo authenticates to S3 as the node
instance role and every scan fails with AccessDenied, long after onboarding reported a
healthy connection.

Set serviceAccount.annotations with eks.amazonaws.com/role-arn to attach an IRSA role,
which is the documented production path for S3 access.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cryo.serviceAccountName" . }}
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
