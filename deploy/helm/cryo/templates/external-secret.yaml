{{- /*
Creates the Secret named by global.envFromSecret through the External Secrets Operator.
See externalSecret in values.yaml. Off by default.
*/ -}}
{{- if .Values.externalSecret.enabled }}
{{- if not .Values.global.envFromSecret }}
{{- fail "global.envFromSecret must be set when externalSecret.enabled is true" }}
{{- end }}
{{- $store := .Values.externalSecret.secretStore }}
{{- if and (not $store.create) (not $store.name) }}
{{- fail "externalSecret.secretStore.name must be set when externalSecret.secretStore.create is false" }}
{{- end }}
{{- if and $store.create (not $store.region) }}
{{- fail "externalSecret.secretStore.region must be set when externalSecret.secretStore.create is true" }}
{{- end }}
{{- $hasDatabaseUrl := false }}
{{- range .Values.externalSecret.data }}
{{- if eq .secretKey "CRYO_DATABASE_URL" }}
{{- $hasDatabaseUrl = true }}
{{- end }}
{{- end }}
{{- if not $hasDatabaseUrl }}
{{- fail "externalSecret.data must include a CRYO_DATABASE_URL mapping" }}
{{- end }}
{{- if and $store.create (not (index (.Values.serviceAccount.annotations | default dict) "eks.amazonaws.com/role-arn")) }}
{{- fail "serviceAccount.annotations.eks.amazonaws.com/role-arn must be set when Cryo creates the SecretStore" }}
{{- end }}
{{- if $store.create }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "cryo.secretStoreName" . }}
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "cryo.serviceAccountName" . }}
            namespace: {{ .Release.Namespace }}
      region: {{ $store.region }}
      service: SecretsManager
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "cryo.fullname" . }}-external-secret
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "cryo.secretStoreName" . }}
    kind: SecretStore
  target:
    name: {{ .Values.global.envFromSecret }}
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy }}
    deletionPolicy: {{ .Values.externalSecret.target.deletionPolicy }}
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key }}
        {{- with .remoteRef.property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
