{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryo.fullname" . }}-web
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "cryo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "cryo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- include "cryo.imagePullSecrets" . | nindent 6 }}
      {{- include "cryo.nodeSelector" . | nindent 6 }}
      {{- include "cryo.podSecurityContext" (list $ $.Values.web.podSecurityContext) | nindent 6 }}
      containers:
        - name: web
          image: {{ include "cryo.imageRef" .Values.web.image | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          {{- include "cryo.containerSecurityContext" $ | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            # nginx-unprivileged 15-local-resolvers.envsh exports NGINX_LOCAL_RESOLVERS
            # from the pod's nameserver (NodeLocal DNSCache 169.254.20.10 on EKS).
            # kube-dns.kube-system.svc.cluster.local is often unreachable from the
            # pod when that cache is installed; short names also fail because nginx
            # does not apply search domains.
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
            - name: NGINX_ENVSUBST_FILTER
              value: "NGINX_LOCAL_RESOLVERS|CRYO_API_UPSTREAM|CRYO_WEB_HSTS"
            - name: CRYO_API_UPSTREAM
              value: "http://{{ include "cryo.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
            # Strict-Transport-Security value; empty sends no header (web/nginx.conf).
            - name: CRYO_WEB_HSTS
              {{- with .Values.web.hsts }}
              value: {{ if .enabled }}{{ printf "max-age=%d%s%s" (int .maxAgeSeconds) (ternary "; includeSubDomains" "" .includeSubDomains) (ternary "; preload" "" .preload) | quote }}{{ else }}""{{ end }}
              {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.web.probe.livenessInitialDelaySeconds }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.web.probe.readinessInitialDelaySeconds }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cryo.fullname" . }}-web
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "cryo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
{{- end }}
