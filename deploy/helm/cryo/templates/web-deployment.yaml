{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryo.fullname" . }}-web
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "cryo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "cryo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- include "cryo.imagePullSecrets" . | nindent 6 }}
      {{- include "cryo.nodeSelector" . | nindent 6 }}
      {{- include "cryo.podSecurityContext" (list $ $.Values.web.podSecurityContext) | nindent 6 }}
      containers:
        - name: web
          image: {{ include "cryo.imageRef" .Values.web.image | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          {{- include "cryo.containerSecurityContext" $ | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            # nginx.conf.template's envsubst target -- defaults to this release's own
            # api Service (cryo.fullname), not a hardcoded "cryo-api", so web still
            # finds its backend under any release name. See web/nginx.conf.template.
            - name: CRYO_API_UPSTREAM
              value: {{ .Values.web.apiUpstream | default (printf "%s-api:%v" (include "cryo.fullname" .) .Values.api.port) | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.web.probe.livenessInitialDelaySeconds }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.web.probe.readinessInitialDelaySeconds }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cryo.fullname" . }}-web
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "cryo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
{{- end }}
