{{- define "cryo.workerPod" -}}
image: "{{ .root.Values.image.repository }}:{{ .root.Values.image.tag }}"
imagePullPolicy: {{ .root.Values.image.pullPolicy }}
env:
  {{- range $k, $v := .root.Values.global.env }}
  - name: {{ $k }}
    value: {{ $v | quote }}
  {{- end }}
  {{- if .root.Values.native.enabled }}
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: CRYO_NATIVE_IMAGE
    value: "{{ .root.Values.native.image.repository }}:{{ .root.Values.native.image.tag }}"
  - name: CRYO_NATIVE_IMAGE_PULL_POLICY
    value: {{ .root.Values.native.image.pullPolicy | quote }}
  {{- if .root.Values.imagePullSecrets }}
  - name: CRYO_NATIVE_IMAGE_PULL_SECRETS
    value: {{ join "," .root.Values.imagePullSecrets | quote }}
  {{- end }}
  - name: CRYO_NATIVE_SERVICE_ACCOUNT
    value: {{ .root.Values.native.serviceAccount | default "default" | quote }}
  - name: CRYO_NATIVE_TTL_SECONDS
    value: {{ .root.Values.native.ttlSecondsAfterFinished | default 3600 | quote }}
  - name: CRYO_NATIVE_SPOT_ALLOW
    value: {{ .root.Values.native.spot.allow | quote }}
  - name: CRYO_NATIVE_SPOT_MAX_CHUNK_GB
    value: {{ .root.Values.native.spot.maxChunkSizeGb | quote }}
  - name: CRYO_NATIVE_SPOT_MAX_DURATION_SECONDS
    value: {{ .root.Values.native.spot.maxEstimatedDurationSeconds | quote }}
  - name: CRYO_NATIVE_SPOT_REQUIRE_CHECKPOINTING
    value: {{ .root.Values.native.spot.requireCheckpointing | quote }}
  {{- end }}
  {{- if .root.Values.spark.k8s.enabled }}
  - name: CRYO_SPARK_K8S_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: CRYO_SPARK_K8S_IMAGE
    value: "{{ .root.Values.spark.k8s.image.repository }}:{{ .root.Values.spark.k8s.image.tag }}"
  - name: CRYO_SPARK_K8S_IMAGE_PULL_POLICY
    value: {{ .root.Values.spark.k8s.image.pullPolicy | quote }}
  {{- if .root.Values.imagePullSecrets }}
  - name: CRYO_SPARK_K8S_IMAGE_PULL_SECRETS
    value: {{ join "," .root.Values.imagePullSecrets | quote }}
  {{- end }}
  - name: CRYO_SPARK_K8S_SERVICE_ACCOUNT
    value: {{ include "cryo.fullname" .root }}-spark
  - name: CRYO_SPARK_K8S_DRIVER_CPU_MILLI
    value: {{ .root.Values.spark.k8s.driverCpuMilli | quote }}
  - name: CRYO_SPARK_K8S_DRIVER_MEM_MIB
    value: {{ .root.Values.spark.k8s.driverMemMib | quote }}
  - name: CRYO_SPARK_K8S_EXECUTOR_CPU_MILLI
    value: {{ .root.Values.spark.k8s.executorCpuMilli | quote }}
  - name: CRYO_SPARK_K8S_EXECUTOR_MEM_MIB
    value: {{ .root.Values.spark.k8s.executorMemMib | quote }}
  - name: CRYO_SPARK_K8S_EXECUTOR_INSTANCES
    value: {{ .root.Values.spark.k8s.executorInstances | quote }}
  - name: CRYO_SPARK_K8S_ACTIVE_DEADLINE_SECONDS
    value: {{ .root.Values.spark.k8s.activeDeadlineSeconds | quote }}
  - name: CRYO_SPARK_K8S_TTL_SECONDS_AFTER_FINISHED
    value: {{ .root.Values.spark.k8s.ttlSecondsAfterFinished | quote }}
  {{- end }}
envFrom:
  {{- include "cryo.envFrom" .root | nindent 2 }}
resources:
  {{- toYaml .resources | nindent 2 }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryo.fullname" . }}-worker
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not (and .Values.native.enabled .Values.native.keda.enabled) }}
  # Omitted when KEDA manages this Deployment: KEDA's HPA owns .spec.replicas via
  # server-side apply once active, and a static value here fights it for ownership
  # on every `helm upgrade` (rejected as a field-manager conflict).
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cryo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "cryo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "cryo.imagePullSecrets" . | nindent 6 }}
      {{- include "cryo.nodeSelector" . | nindent 6 }}
      {{- if or .Values.native.enabled .Values.spark.k8s.enabled }}
      # -native grants batch/jobs create/get/list/watch/delete, which is also all
      # Worker needs to submit a Spark-on-K8s dispatch Job (see rbac-native.yaml) --
      # the Spark driver/executor pods run under their own -spark SA (rbac-spark.yaml),
      # not this one.
      serviceAccountName: {{ include "cryo.fullname" . }}-native
      {{- end }}
      containers:
        - name: worker
          command: ["cryo", "worker"]
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          {{- include "cryo.workerPod" (dict "root" . "resources" .Values.worker.resources) | nindent 10 }}
