{{- define "cryo.workerPod" -}}
image: "{{ .root.Values.image.repository }}:{{ .root.Values.image.tag }}"
imagePullPolicy: {{ .root.Values.image.pullPolicy }}
env:
  {{- range $k, $v := .root.Values.global.env }}
  - name: {{ $k }}
    value: {{ $v | quote }}
  {{- end }}
  {{- if .root.Values.native.enabled }}
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: CRYO_NATIVE_IMAGE
    value: "{{ .root.Values.native.image.repository }}:{{ .root.Values.native.image.tag }}"
  - name: CRYO_NATIVE_IMAGE_PULL_POLICY
    value: {{ .root.Values.native.image.pullPolicy | quote }}
  {{- if .root.Values.imagePullSecrets }}
  - name: CRYO_NATIVE_IMAGE_PULL_SECRETS
    value: {{ join "," .root.Values.imagePullSecrets | quote }}
  {{- end }}
  - name: CRYO_NATIVE_SERVICE_ACCOUNT
    value: {{ .root.Values.native.serviceAccount | default "default" | quote }}
  - name: CRYO_NATIVE_TTL_SECONDS
    value: {{ .root.Values.native.ttlSecondsAfterFinished | default 3600 | quote }}
  - name: CRYO_NATIVE_SPOT_ALLOW
    value: {{ .root.Values.native.spot.allow | quote }}
  - name: CRYO_NATIVE_SPOT_MAX_CHUNK_GB
    value: {{ .root.Values.native.spot.maxChunkSizeGb | quote }}
  - name: CRYO_NATIVE_SPOT_MAX_DURATION_SECONDS
    value: {{ .root.Values.native.spot.maxEstimatedDurationSeconds | quote }}
  - name: CRYO_NATIVE_SPOT_REQUIRE_CHECKPOINTING
    value: {{ .root.Values.native.spot.requireCheckpointing | quote }}
  {{- end }}
envFrom:
  {{- include "cryo.envFrom" .root | nindent 2 }}
resources:
  {{- toYaml .resources | nindent 2 }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryo.fullname" . }}-worker
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not (and .Values.native.enabled .Values.native.keda.enabled) }}
  # Omitted when KEDA manages this Deployment: KEDA's HPA owns .spec.replicas via
  # server-side apply once active, and a static value here fights it for ownership
  # on every `helm upgrade` (rejected as a field-manager conflict).
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cryo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "cryo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "cryo.imagePullSecrets" . | nindent 6 }}
      {{- include "cryo.nodeSelector" . | nindent 6 }}
      {{- if .Values.native.enabled }}
      serviceAccountName: {{ include "cryo.fullname" . }}-native
      {{- end }}
      containers:
        - name: worker
          command: ["cryo", "worker"]
          {{- include "cryo.workerPod" (dict "root" . "resources" .Values.worker.resources) | nindent 10 }}
