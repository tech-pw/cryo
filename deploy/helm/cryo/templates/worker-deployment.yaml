{{- define "cryo.workerPod" -}}
image: "{{ .root.Values.image.repository }}:{{ .root.Values.image.tag }}"
imagePullPolicy: {{ .root.Values.image.pullPolicy }}
env:
  {{- range $k, $v := .root.Values.global.env }}
  - name: {{ $k }}
    value: {{ $v | quote }}
  {{- end }}
  {{- if .root.Values.native.enabled }}
  - name: CRYO_K8S_NAMESPACE
    value: {{ .root.Release.Namespace | quote }}
  - name: CRYO_NATIVE_K8S_SERVICE_ACCOUNT
    value: {{ include "cryo.fullname" .root }}-native
  - name: CRYO_NATIVE_SPOT_ALLOW
    value: {{ .root.Values.native.spot.allow | quote }}
  - name: CRYO_NATIVE_SPOT_MAX_CHUNK_GB
    value: {{ .root.Values.native.spot.maxChunkSizeGb | quote }}
  - name: CRYO_NATIVE_SPOT_MAX_DURATION_SECONDS
    value: {{ .root.Values.native.spot.maxEstimatedDurationSeconds | quote }}
  - name: CRYO_NATIVE_SPOT_REQUIRE_CHECKPOINTING
    value: {{ .root.Values.native.spot.requireCheckpointing | quote }}
  {{- end }}
envFrom:
  {{- include "cryo.envFrom" .root | nindent 2 }}
resources:
  {{- toYaml .resources | nindent 2 }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryo.fullname" . }}-worker
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "cryo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "cryo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "cryo.imagePullSecrets" . | nindent 6 }}
      {{- include "cryo.nodeSelector" . | nindent 6 }}
      {{- if .Values.native.enabled }}
      serviceAccountName: {{ include "cryo.fullname" . }}-native
      {{- end }}
      containers:
        - name: worker
          command: ["cryo", "worker"]
          {{- include "cryo.workerPod" (dict "root" . "resources" .Values.worker.resources) | nindent 10 }}
