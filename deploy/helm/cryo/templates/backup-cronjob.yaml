{{- if .Values.backup.enabled }}
{{- if not .Values.backup.s3Uri }}
{{- fail "backup.enabled requires backup.s3Uri" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cryo.fullname" . }}-backup
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "cryo.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ .Values.backup.serviceAccount | quote }}
          {{- include "cryo.imagePullSecrets" . | nindent 10 }}
          {{- include "cryo.nodeSelector" . | nindent 10 }}
          containers:
            - name: backup
              image: {{ include "cryo.imageRef" .Values.image | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "cryo.operations.backup"]
              args:
                - create-offsite
                - --s3-uri
                - {{ .Values.backup.s3Uri | quote }}
                - --retention-days
                - {{ .Values.backup.retentionDays | quote }}
              env:
                {{- range $k, $v := .Values.global.env }}
                - name: {{ $k }}
                  value: {{ $v | quote }}
                {{- end }}
              envFrom:
                {{- include "cryo.envFrom" . | nindent 16 }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
{{- end }}
