{{- /*
Native engine Job template.

Jobs are created by the Governor on admit (cryo.engines.native.job_dispatch.create_native_job)
rather than via `helm install`. This file documents runtime sizing only and emits no Job.

Resource sizing (cryo.engines.native.resources.estimate_table_resources):
  - Peak mem across planned ops (expire / orphan / rewrite), clamped to ≤16Gi
  - Grouped runs: bin-pack cold tables into shared pods; hot tables dedicated
  - Serial execution within a shared pod → request = max(member cpu/mem)

Hard ceiling: native.maxMemory must not exceed 16Gi (enforced in Python).

Values:
  - native.enabled          : enable Governor RBAC and runtime dispatch
  - native.image.*          : Job container image
  - native.serviceAccount   : Job pod SA
  - native.ttlSecondsAfterFinished
  - native.maxCpu / native.maxMemory (maxMemory hard-capped at 16Gi)
*/ -}}

{{- /*
This template intentionally emits no resource. Native Jobs are runtime objects
created by the Governor after admission; rendering a static Job here would start
an untracked engine pod without a payload on every Helm install/upgrade.
*/ -}}
