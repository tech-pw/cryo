{{- /*
Native engine Job template.

Rendered programmatically by cryo.engines.native.job_dispatch (kubernetes Python
client) rather than via `helm install`.  This file serves as:
  1. Documentation of the expected Job structure
  2. A reference manifest operators can apply manually if they prefer Helm over
     the Python client
  3. The base template that could alternatively be rendered via Helm SDK in
     environments where the Python client is unavailable

Values used by the Python client (job_dispatch.py):
  - native.enabled          : enable K8s Job dispatch (default: false)
  - native.image.repository : cryo image for the Job pod
  - native.image.tag        : image tag
  - native.image.pullPolicy : pull policy
  - native.serviceAccount   : service account for the Job pod
  - native.ttlSecondsAfterFinished : TTL cleanup after Job completes (default: 300)
  - native.defaultChunkSizeGb : default chunk size for resource estimation (default: 100)
  - native.maxCpu          : maximum CPU allocation per Job (default: 4000m)
  - native.maxMemory       : maximum memory allocation per Job (default: 16Gi)

Resource sizing (computed by job_dispatch.compute_job_resources):
  CPU     = min(native.maxCpu,    250m + chunk_size_gb/10 * 100m)
  Memory  = min(native.maxMemory, 512Mi + chunk_size_gb/10 * 128Mi)
*/ -}}

{{- define "cryo.nativeJobEnv" -}}
{{- $root := .root -}}
env:
  {{- range $k, $v := $root.Values.global.env }}
  - name: {{ $k }}
    value: {{ $v | quote }}
  {{- end }}
envFrom:
  {{- include "cryo.envFrom" $root | nindent 2 }}
{{- end -}}

{{- if .Values.native.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cryo.fullname" . }}-native-{{ .Chart.Version | replace "." "-" | lower }}
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: native-engine
spec:
  ttlSecondsAfterFinished: {{ .Values.native.ttlSecondsAfterFinished | default 300 }}
  activeDeadlineSeconds: 7200
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "cryo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: native-engine
    spec:
      restartPolicy: Never
      serviceAccountName: {{ if .Values.native.enabled }}{{ include "cryo.fullname" . }}-native{{ else }}{{ .Values.native.serviceAccount | default "default" }}{{ end }}
      containers:
        - name: cryo-engine
          image: "{{ .Values.native.image.repository }}:{{ .Values.native.image.tag }}"
          imagePullPolicy: {{ .Values.native.image.pullPolicy }}
          command:
            - /usr/local/bin/cryo-engine-go
            - execute
          env:
            - name: CRYO_PAYLOAD_B64
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryo.fullname" . }}-native-payload
                  key: payload
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
{{- end }}
