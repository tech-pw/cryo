apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryo.fullname" . }}-governor
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: governor
spec:
  replicas: {{ .Values.governor.replicas }}
  selector:
    matchLabels:
      {{- include "cryo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: governor
  template:
    metadata:
      labels:
        {{- include "cryo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: governor
      annotations:
        {{- include "cryo.prometheusAnnotations" . | nindent 8 }}
        # native_admit.py's SQL-fallback dispatch runs synchronously inside the admission
        # wave and blocks it for the full duration of the Spark job (minutes, not seconds,
        # for anything beyond a metadata-only op) -- Karpenter consolidating this pod
        # mid-wave ("Evicted pod: Underutilized") silently drops that in-flight dispatch
        # and its cleanup. Confirmed live against example-cluster, 2026-07-21.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      {{- include "cryo.imagePullSecrets" . | nindent 6 }}
      {{- include "cryo.nodeSelector" . | nindent 6 }}
      {{- if or .Values.native.enabled .Values.spark.k8s.enabled }}
      serviceAccountName: {{ include "cryo.fullname" . }}-governor
      {{- end }}
      containers:
        - name: governor
          image: {{ include "cryo.imageRef" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["cryo", "governor"]
          ports:
            - name: metrics
              containerPort: {{ .Values.observability.metricsPort }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.global.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: CRYO_HEALTH_PORT
              value: {{ .Values.observability.metricsPort | quote }}
            {{- if .Values.native.enabled }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CRYO_NATIVE_IMAGE
              value: {{ include "cryo.imageRef" .Values.native.image | quote }}
            - name: CRYO_NATIVE_IMAGE_PULL_POLICY
              value: {{ .Values.native.image.pullPolicy | quote }}
            {{- if .Values.imagePullSecrets }}
            - name: CRYO_NATIVE_IMAGE_PULL_SECRETS
              value: {{ join "," .Values.imagePullSecrets | quote }}
            {{- end }}
            - name: CRYO_NATIVE_SERVICE_ACCOUNT
              value: {{ .Values.native.serviceAccount | default "default" | quote }}
            - name: CRYO_NATIVE_TTL_SECONDS
              value: {{ .Values.native.ttlSecondsAfterFinished | default 3600 | quote }}
            - name: CRYO_NATIVE_SPOT_ALLOW
              value: {{ .Values.native.spot.allow | quote }}
            - name: CRYO_NATIVE_SPOT_MAX_CHUNK_GB
              value: {{ .Values.native.spot.maxChunkSizeGb | quote }}
            - name: CRYO_NATIVE_SPOT_MAX_DURATION_SECONDS
              value: {{ .Values.native.spot.maxEstimatedDurationSeconds | quote }}
            - name: CRYO_NATIVE_SPOT_REQUIRE_CHECKPOINTING
              value: {{ .Values.native.spot.requireCheckpointing | quote }}
            {{- if .Values.scanner.jobDispatch.enabled }}
            - name: CRYO_SCANNER_JOB_DISPATCH_ENABLED
              value: "true"
            - name: CRYO_SCANNER_JOB_DISPATCH_BATCH_SIZE
              value: {{ .Values.scanner.jobDispatch.batchSize | default 1 | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.spark.k8s.enabled }}
            # Governor (not Worker) is what actually calls SparkK8sClient -- native_admit.py's
            # _dispatch_fallback_operations runs inline during Governor's create-on-admit loop.
            # Without these, SparkK8sConfig falls back to namespace="default"/serviceAccount=
            # "default", which have no RBAC binding -- the create_namespaced_job call 403s.
            - name: CRYO_SPARK_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CRYO_SPARK_K8S_IMAGE
              value: {{ include "cryo.imageRef" .Values.spark.k8s.image | quote }}
            - name: CRYO_SPARK_K8S_IMAGE_PULL_POLICY
              value: {{ .Values.spark.k8s.image.pullPolicy | quote }}
            {{- if .Values.imagePullSecrets }}
            - name: CRYO_SPARK_K8S_IMAGE_PULL_SECRETS
              value: {{ join "," .Values.imagePullSecrets | quote }}
            {{- end }}
            - name: CRYO_SPARK_K8S_SERVICE_ACCOUNT
              value: {{ include "cryo.fullname" . }}-spark
            - name: CRYO_SPARK_K8S_DRIVER_CPU_MILLI
              value: {{ .Values.spark.k8s.driverCpuMilli | quote }}
            - name: CRYO_SPARK_K8S_DRIVER_MEM_MIB
              value: {{ .Values.spark.k8s.driverMemMib | quote }}
            - name: CRYO_SPARK_K8S_EXECUTOR_CPU_MILLI
              value: {{ .Values.spark.k8s.executorCpuMilli | quote }}
            - name: CRYO_SPARK_K8S_EXECUTOR_MEM_MIB
              value: {{ .Values.spark.k8s.executorMemMib | quote }}
            - name: CRYO_SPARK_K8S_EXECUTOR_INSTANCES
              value: {{ .Values.spark.k8s.executorInstances | quote }}
            - name: CRYO_SPARK_K8S_ACTIVE_DEADLINE_SECONDS
              value: {{ .Values.spark.k8s.activeDeadlineSeconds | quote }}
            - name: CRYO_SPARK_K8S_TTL_SECONDS_AFTER_FINISHED
              value: {{ .Values.spark.k8s.ttlSecondsAfterFinished | quote }}
            - name: CRYO_SPARK_K8S_SLOT_CAP
              value: {{ .Values.spark.k8s.slotCap | quote }}
            {{- end }}
          envFrom:
            {{- include "cryo.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.governor.resources | nindent 12 }}
