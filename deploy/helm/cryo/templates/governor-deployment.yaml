apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryo.fullname" . }}-governor
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: governor
spec:
  replicas: {{ .Values.governor.replicas }}
  selector:
    matchLabels:
      {{- include "cryo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: governor
  template:
    metadata:
      labels:
        {{- include "cryo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: governor
    spec:
      {{- include "cryo.imagePullSecrets" . | nindent 6 }}
      {{- include "cryo.nodeSelector" . | nindent 6 }}
      {{- if .Values.native.enabled }}
      serviceAccountName: {{ include "cryo.fullname" . }}-native
      {{- end }}
      containers:
        - name: governor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["cryo", "governor"]
          env:
            {{- range $k, $v := .Values.global.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.native.enabled }}
            - name: CRYO_K8S_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- end }}
          envFrom:
            {{- include "cryo.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.governor.resources | nindent 12 }}
