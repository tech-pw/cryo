apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cryo.fullname" . }}-scanner
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
spec:
  schedule: {{ .Values.scanner.schedule | quote }}
  suspend: {{ .Values.scanner.suspend | default false }}
  # A wedged pod must not pile up behind the schedule: one scanner run at a time (#163).
  concurrencyPolicy: {{ .Values.scanner.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      # Hard stop for the whole Job. A pod blocked on a hung metastore call once ran for
      # 7 days with nothing to stop it (#163). Keep it below the schedule interval.
      {{- with .Values.scanner.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      # Indexed, so each pod gets a distinct JOB_COMPLETION_INDEX to pass as --chunk-id.
      # Before 2026-09-22 this ran a single pod with no arguments, so cryo.scanner.run fell
      # back to its defaults (chunk_id=0, scan_num_chunks=4) and every run silently discarded
      # three quarters of the fleet: `discovered=12584, assigned=3146`. Keep completions,
      # parallelism and --num-chunks equal or the fleet is only partly covered again.
      completionMode: Indexed
      completions: {{ .Values.scanner.chunks }}
      parallelism: {{ .Values.scanner.chunks }}
      template:
        metadata:
          labels:
            {{- include "cryo.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: scanner
            eks-workload-name: cryo-scanner
            eks-workload-type: Job
        spec:
          restartPolicy: OnFailure
          {{- include "cryo.imagePullSecrets" . | nindent 10 }}
          {{- include "cryo.nodeSelector" . | nindent 10 }}
          {{- include "cryo.podSecurityContext" (list $ (dict)) | nindent 10 }}
          containers:
            - name: scanner
              image: {{ include "cryo.imageRef" .Values.image | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- include "cryo.containerSecurityContext" $ | nindent 14 }}
              command: ["python", "-m", "cryo.scanner.run"]
              args:
                - "--chunk-id"
                - "$(JOB_COMPLETION_INDEX)"
                - "--num-chunks"
                - {{ .Values.scanner.chunks | quote }}
              env:
                - name: JOB_COMPLETION_INDEX
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
                {{- range $k, $v := .Values.global.env }}
                - name: {{ $k }}
                  value: {{ $v | quote }}
                {{- end }}
              envFrom:
                {{- include "cryo.envFrom" . | nindent 16 }}
              resources:
                {{- toYaml .Values.scanner.resources | nindent 16 }}
