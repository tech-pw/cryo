apiVersion: v1
kind: Service
metadata:
  name: {{ include "cryo.fullname" . }}-scanner-worker
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner-worker
spec:
  type: ClusterIP
  selector:
    {{- include "cryo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: scanner-worker
  ports:
    - name: metrics
      port: {{ .Values.observability.metricsPort }}
      targetPort: metrics
