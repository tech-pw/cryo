{{- /*
KEDA ScaledObject for Worker replicas (native-engine-scoping-research.md §6.2).

Scales the long-lived Worker Deployment against the count of jobs in ADMITTED/RUNNING status
(cryo.jobs, exposed via each Worker's own /scale-metric endpoint -- see
cryo/observability/health_server.py and cli.py's _worker_scale_metric). Workers still create
per-chunk Kubernetes Jobs when `k8s_dispatch` is enabled — KEDA supplies elastic Worker count,
Jobs supply elastic compute per chunk.

Regression, 2026-07-31: this used to watch the Redis `cryo:admitted` list's *length* instead.
A worker pops a job off that list within seconds of admission -- long before the job itself
finishes -- so the list reads ~0 almost continuously even while every replica is saturated for
hours (worker.py's process_next() runs a job's entire plan synchronously before claiming
another). KEDA saw "nothing pending" and never scaled up; confirmed live, it also reverted a
manual scale-up 9 seconds after being applied ("all metrics below target"), killing a worker
mid-dispatch and orphaning the job it had just claimed. ADMITTED+RUNNING count doesn't have
this blind spot: it stays elevated for a job's whole duration, so a 1:1 target value maps
directly onto "how many replicas would let every active job progress concurrently".

Requires the KEDA operator installed in the cluster. Disabled by default.
*/ -}}
{{- if and .Values.native.enabled .Values.native.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "cryo.fullname" . }}-worker
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    name: {{ include "cryo.fullname" . }}-worker
  minReplicaCount: {{ .Values.native.keda.minReplicas | default 1 }}
  maxReplicaCount: {{ .Values.native.keda.maxReplicas | default 10 }}
  pollingInterval: {{ .Values.native.keda.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.native.keda.cooldownPeriod | default 60 }}
  triggers:
    - type: metrics-api
      metadata:
        targetValue: {{ .Values.native.keda.listLength | default "1" | quote }}
        url: "http://{{ include "cryo.fullname" . }}-worker.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.observability.metricsPort }}/scale-metric"
        valueLocation: "value"
{{- end }}
