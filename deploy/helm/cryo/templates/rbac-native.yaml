{{- /*
RBAC for the Worker's legacy blocking native-Job path (cryo.engines.native.job_dispatch.
execute_request_via_job, used when a table isn't dispatched via Governor create-on-admit).
Governor admission uses its own ServiceAccount (governor-rbac.yaml).
*/ -}}
{{- if .Values.native.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cryo.fullname" . }}-native
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: native-engine
{{- if .Values.imagePullSecrets }}
imagePullSecrets:
  {{- range .Values.imagePullSecrets }}
  - name: {{ . }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cryo.fullname" . }}-native
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: native-engine
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cryo.fullname" . }}-native
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: native-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cryo.fullname" . }}-native
subjects:
  - kind: ServiceAccount
    name: {{ include "cryo.fullname" . }}-native
    namespace: {{ .Release.Namespace }}
{{- end }}
