{{- /*
RBAC for the Worker pod's own job-dispatch needs: the legacy blocking native-Job path
(cryo.engines.native.job_dispatch.execute_request_via_job, used when a table isn't
dispatched via Governor create-on-admit) and submitting Spark-on-K8s fallback dispatch
Jobs (cryo.engines.spark.k8s) -- both are just "create a batch/v1 Job", so one Role
covers both; Governor admission uses its own ServiceAccount (governor-rbac.yaml), and
the Spark driver/executor pods run under their own SA (rbac-spark.yaml), not this one.
pods/delete is required so SparkK8sClient.cleanup_after_run can reclaim completed
driver pods (Spark does not own them to the wrapper Job).
*/ -}}
{{- if or .Values.native.enabled .Values.spark.k8s.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cryo.fullname" . }}-native
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: native-engine
{{- with .Values.native.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- if .Values.imagePullSecrets }}
imagePullSecrets:
  {{- range .Values.imagePullSecrets }}
  - name: {{ . }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cryo.fullname" . }}-native
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: native-engine
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    # delete: Spark-on-K8s completed driver pods are not Job-owned; Worker must
    # reclaim them via SparkK8sClient.cleanup_after_run after the run finishes.
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cryo.fullname" . }}-native
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: native-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cryo.fullname" . }}-native
subjects:
  - kind: ServiceAccount
    name: {{ include "cryo.fullname" . }}-native
    namespace: {{ .Release.Namespace }}
{{- end }}
