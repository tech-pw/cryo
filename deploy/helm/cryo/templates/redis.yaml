# In-namespace Redis for Cryo's own job queue (governor/worker/scanner). Single instance,
# no persistence, no LoadBalancer/Ingress -- ClusterIP only. This is intentionally minimal:
# not a shared/HA Redis, just enough for Cryo's queue to function inside the cryo namespace.
#
# "No persistence" is deliberate and now honest: there is no volume here, so snapshotting to
# /data only ever wrote to the container's ephemeral layer. Postgres is the source of truth
# and the reconcile paths rebuild Redis after a restart. See values.yaml `redis:` for why
# maxmemory/save are set the way they are.
{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cryo.fullname" . }}-redis
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cryo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "cryo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      {{- include "cryo.podSecurityContext" (list $ $.Values.redis.podSecurityContext) | nindent 6 }}
      containers:
        - name: redis
          image: {{ include "cryo.imageRef" .Values.redis.image | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          {{- include "cryo.containerSecurityContext" $ | nindent 10 }}
          args:
            - --maxmemory
            - {{ .Values.redis.maxmemory | quote }}
            - --maxmemory-policy
            - {{ .Values.redis.maxmemoryPolicy | quote }}
            # Empty string disables RDB snapshots entirely. Quoted and passed as one argument
            # so redis-server sees `--save ""` rather than a bare flag followed by the next
            # option, which it would read as a save spec.
            - --save
            - {{ .Values.redis.save | quote }}
          ports:
            - name: redis
              containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cryo.fullname" . }}-redis
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    {{- include "cryo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
