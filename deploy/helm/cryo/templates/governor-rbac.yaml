{{- /*
RBAC for Governor to create/watch native maintenance Jobs on admit.
*/ -}}
{{- if .Values.native.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cryo.fullname" . }}-governor
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: governor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cryo.fullname" . }}-native-jobs
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cryo.fullname" . }}-governor-native-jobs
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cryo.fullname" . }}-native-jobs
subjects:
  - kind: ServiceAccount
    name: {{ include "cryo.fullname" . }}-governor
    namespace: {{ .Release.Namespace }}
{{- end }}
