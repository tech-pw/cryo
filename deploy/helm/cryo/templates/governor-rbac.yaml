{{- /*
RBAC for Governor to create/watch native maintenance Jobs on admit, and (when
spark.k8s.enabled) to submit the Spark-on-K8s dispatch Job for SQL-fallback
operations -- native_admit.py's _dispatch_fallback_operations calls
SparkK8sClient.submit_spark_sql directly from the Governor process. batch/jobs
create is all that call needs; the Spark driver/executor pods it spins up run
under their own -spark SA (rbac-spark.yaml), not this one.
*/ -}}
{{- if or .Values.native.enabled .Values.spark.k8s.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cryo.fullname" . }}-governor
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: governor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cryo.fullname" . }}-native-jobs
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    # delete: same as rbac-native -- reclaim Spark driver pods after SQL-fallback
    # runs the Governor dispatches directly (native_admit fallback path).
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cryo.fullname" . }}-governor-native-jobs
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cryo.fullname" . }}-native-jobs
subjects:
  - kind: ServiceAccount
    name: {{ include "cryo.fullname" . }}-governor
    namespace: {{ .Release.Namespace }}
{{- end }}
