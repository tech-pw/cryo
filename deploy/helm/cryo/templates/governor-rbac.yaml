{{- /*
RBAC for Governor to create/watch native maintenance Jobs on admit, and (when
spark.k8s.enabled) to submit the Spark-on-K8s dispatch Job for SQL-fallback
operations -- native_admit.py's _dispatch_fallback_operations calls
SparkK8sClient.submit_spark_sql directly from the Governor process. The Spark
driver/executor pods it spins up run under their own -spark SA (rbac-spark.yaml),
not this one -- except for delete, which the Governor also needs directly:
cluster-mode spark-submit's driver pod has no owner reference back to the
wrapper Job, so Kubernetes' Job-TTL controller can never cascade-delete it (see
cleanup_stale_driver_pods's docstring). Confirmed live, 2026-08-06: this rule
lacked "delete" on pods, so GovernorRunner._cleanup_stale_spark_driver_pods's
periodic sweep listed 3,300+ stale driver pods correctly but got 403 Forbidden
on every delete attempt (silently swallowed by the tick's own best-effort
exception handling -- same "no error surfaced" class of gap as the earlier
NativeJobWatcher tick issue this session).
*/ -}}
{{- if or .Values.native.enabled .Values.spark.k8s.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cryo.fullname" . }}-governor
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
    app.kubernetes.io/component: governor
{{- with .Values.governor.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- if .Values.imagePullSecrets }}
imagePullSecrets:
  {{- range .Values.imagePullSecrets }}
  - name: {{ . }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cryo.fullname" . }}-native-jobs
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    # delete: same as rbac-native -- reclaim Spark driver pods after SQL-fallback
    # runs the Governor dispatches directly (native_admit fallback path).
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cryo.fullname" . }}-governor-native-jobs
  labels:
    {{- include "cryo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cryo.fullname" . }}-native-jobs
subjects:
  - kind: ServiceAccount
    name: {{ include "cryo.fullname" . }}-governor
    namespace: {{ .Release.Namespace }}
{{- end }}
