<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 820" width="980" height="820" role="img" aria-labelledby="title desc">
  <title id="title">Two Iceberg catalog tables pointing at one S3 warehouse</title>
  <desc id="desc">
    Before the drop, the prod table and the _evolving table are two names in Hive
    that both point at the same S3 folder. Dropping the evolving table deletes that
    folder, so the prod catalog entry is left pointing at missing metadata.
  </desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#0F766E"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#B91C1C"/>
    </marker>
  </defs>

  <rect width="980" height="820" fill="#F6F3EE"/>

  <text x="40" y="40" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C1917">Two catalog names, one warehouse</text>
  <text x="40" y="64" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13.5" fill="#57534E">Iceberg stores the table on S3. Hive only stores a name that points at that folder. Two names on the same folder are not two copies.</text>

  <rect x="24" y="84" width="932" height="352" rx="14" fill="#FFFEFB" stroke="#E7E5E4"/>
  <rect x="24" y="84" width="8" height="352" rx="4" fill="#0F766E"/>
  <text x="52" y="112" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#0F766E">BEFORE THE DROP</text>
  <text x="52" y="136" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1C1917">Looks like two tables. Physically it is one S3 folder.</text>

  <rect x="48" y="156" width="300" height="256" rx="10" fill="#F5F0E8" stroke="#E7E0D4"/>
  <text x="64" y="180" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#78716C">HIVE / TRINO CATALOG</text>
  <text x="64" y="198" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" fill="#57534E">cdp_catalog   names only</text>

  <rect x="64" y="214" width="268" height="72" rx="8" fill="#1D4E89"/>
  <text x="80" y="242" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F8FAFC">schema.orders</text>
  <text x="80" y="264" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" fill="#BFDBFE">prod table  |  pipelines write here</text>

  <rect x="64" y="304" width="268" height="72" rx="8" fill="#5B4B8A"/>
  <text x="80" y="332" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F8FAFC">schema.orders_evolving</text>
  <text x="80" y="354" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" fill="#DDD6FE">unused name  |  not queried</text>

  <path d="M332 250 H410" fill="none" stroke="#0F766E" stroke-width="2.5"/>
  <path d="M332 340 H410" fill="none" stroke="#0F766E" stroke-width="2.5"/>
  <path d="M410 250 V340" fill="none" stroke="#0F766E" stroke-width="2.5"/>
  <circle cx="410" cy="295" r="5" fill="#0F766E"/>
  <path d="M415 295 H448" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="348" y="238" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F766E">same location</text>

  <rect x="456" y="156" width="476" height="256" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="476" y="180" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#0F766E">S3 WAREHOUSE  |  THE REAL TABLE</text>
  <text x="476" y="198" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" fill="#3F3F46">one folder owned by both catalog names</text>

  <rect x="476" y="218" width="436" height="170" rx="10" fill="#134E4A"/>
  <text x="496" y="250" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#CCFBF1">s3://lake/.../schema/orders/</text>
  <rect x="496" y="268" width="396" height="40" rx="6" fill="#115E59"/>
  <text x="512" y="293" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#99F6E4">metadata/  -&gt;  00042-....metadata.json</text>
  <rect x="496" y="320" width="396" height="40" rx="6" fill="#115E59"/>
  <text x="512" y="345" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#99F6E4">data/      -&gt;  parquet files, manifests</text>

  <rect x="24" y="452" width="932" height="56" rx="10" fill="#9B1C1C"/>
  <text x="490" y="474" text-anchor="middle" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#FECACA">WHAT WE RAN</text>
  <text x="490" y="496" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#FFF7ED">DROP TABLE schema.orders_evolving</text>

  <rect x="24" y="524" width="932" height="272" rx="14" fill="#FFFEFB" stroke="#E7E5E4"/>
  <rect x="24" y="524" width="8" height="272" rx="4" fill="#9B1C1C"/>
  <text x="52" y="552" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#9B1C1C">AFTER THE DROP</text>
  <text x="52" y="576" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1C1917">Iceberg deletes the S3 folder. The prod name is left pointing at nothing.</text>

  <rect x="48" y="596" width="300" height="176" rx="10" fill="#F5F0E8" stroke="#E7E0D4"/>
  <rect x="64" y="616" width="268" height="64" rx="8" fill="#1D4E89"/>
  <text x="80" y="640" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#F8FAFC">schema.orders</text>
  <text x="80" y="660" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="11.5" fill="#BFDBFE">still in the catalog</text>

  <rect x="64" y="692" width="268" height="60" rx="8" fill="none" stroke="#A8A29E" stroke-dasharray="5 4"/>
  <line x1="80" y1="706" x2="316" y2="738" stroke="#A8A29E" stroke-width="1.5"/>
  <text x="80" y="716" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#78716C">schema.orders_evolving</text>
  <text x="80" y="736" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8A29E">Hive entry removed</text>

  <path d="M348 648 H430" fill="none" stroke="#B91C1C" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  <text x="352" y="636" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B91C1C">dangling pointer</text>

  <rect x="456" y="596" width="476" height="176" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <rect x="476" y="616" width="436" height="136" rx="10" fill="#7F1D1D"/>
  <text x="496" y="648" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#FECACA">s3://lake/.../schema/orders/</text>
  <text x="496" y="678" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FEE2E2">Warehouse deleted by the Iceberg drop</text>
  <text x="496" y="706" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" fill="#FECACA">Prod ingestion: metadata file is not found</text>
  <g stroke="#FECACA" stroke-width="3.5" stroke-linecap="round">
    <line x1="860" y1="640" x2="892" y2="672"/>
    <line x1="892" y1="640" x2="860" y2="672"/>
  </g>
</svg>
