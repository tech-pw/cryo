<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cryo Embed Demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #0b1220;
        color: #e5e7eb;
      }
      header {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #1f2937;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      header h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }
      .controls {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      button {
        background: #2563eb;
        color: white;
        border: 0;
        border-radius: 0.375rem;
        padding: 0.45rem 0.75rem;
        cursor: pointer;
        font-size: 0.875rem;
      }
      button.secondary {
        background: #374151;
      }
      main {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: calc(100vh - 57px);
      }
      aside {
        border-right: 1px solid #1f2937;
        padding: 1rem;
        font-size: 0.875rem;
      }
      aside code {
        background: #111827;
        padding: 0.1rem 0.35rem;
        border-radius: 0.25rem;
      }
      #embed-frame {
        width: 100%;
        height: calc(100vh - 57px);
        border: 0;
        background: #111827;
      }
      #events {
        margin-top: 1rem;
        max-height: 40vh;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Cryo Embedded SDK Demo</h1>
      <div class="controls">
        <button id="btn-health">Open Health Dashboard</button>
        <button id="btn-table" class="secondary">Open Table Explorer</button>
        <button id="btn-auth" class="secondary">Send Auth Token</button>
      </div>
    </header>
    <main>
      <aside>
        <p>
          This page demonstrates embedding Cryo in a host application via
          <code>&lt;iframe&gt;</code> and the postMessage bridge.
        </p>
        <p>
          Configure <code>CRYO_EMBED_URL</code> to point at your Cryo UI
          (default <code>http://localhost:5173</code>).
        </p>
        <div id="events"></div>
      </aside>
      <iframe
        id="embed-frame"
        title="Cryo embedded view"
        src="http://localhost:5173/datalake-health"
        allow="clipboard-read; clipboard-write"
      ></iframe>
    </main>
    <script>
      (function () {
        const cryoBase = "http://localhost:5173";
        const frame = document.getElementById("embed-frame");
        const events = document.getElementById("events");

        function safePath(path) {
          if (typeof path !== "string" || !/^\/[A-Za-z0-9/_-]*$/.test(path)) return null;
          return path;
        }

        function log(message, payload) {
          const line = payload
            ? `[${new Date().toISOString()}] ${message} ${JSON.stringify(payload)}`
            : `[${new Date().toISOString()}] ${message}`;
          events.textContent = line + "\n" + events.textContent;
        }

        window.CryoEmbed = {
          navigate(path) {
            const next = safePath(path);
            if (!next) return;
            frame.src = `${cryoBase}${next}`;
            log("navigate", { path: next });
          },
          post(message) {
            frame.contentWindow.postMessage({ source: "cryo-host", ...message }, cryoBase);
            log("postMessage", message);
          },
        };

        document.getElementById("btn-health").addEventListener("click", () => {
          CryoEmbed.navigate("/datalake-health");
        });
        document.getElementById("btn-table").addEventListener("click", () => {
          CryoEmbed.navigate("/catalogs");
        });
        document.getElementById("btn-auth").addEventListener("click", () => {
          CryoEmbed.post({
            type: "auth",
            token: "demo-token-replace-in-production",
          });
        });

        window.addEventListener("message", (event) => {
          if (event.origin !== new URL(cryoBase).origin) return;
          log("iframe event", event.data);
        });

        frame.src = `${cryoBase}/datalake-health`;
        log("initialized", { cryoBase });
      })();
    </script>
  </body>
</html>
