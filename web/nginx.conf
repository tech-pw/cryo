# Mirrors vite.config.ts's dev-server proxy: the built SPA calls relative paths
# (/api/..., /healthz, /metrics) and expects them to reach the backend from the
# same origin -- this reverse-proxies those to the cryo-api Service in-cluster.
#
# `resolver` + a variable in proxy_pass defers the cryo-api DNS lookup to request time
# instead of nginx startup. A bare `proxy_pass http://cryo-api:8000` resolves once, at
# config load, and if CoreDNS isn't ready yet in that exact window (pod scheduling race,
# cluster churn) nginx refuses to start at all and crash-loops forever, even though the
# same lookup succeeds moments later and the Service has healthy endpoints throughout.
# Confirmed live, 2026-10-08: "host not found in upstream \"cryo-api\"" at boot, 396
# restarts over 33h, while cryo-api's own Service endpoints were continuously healthy.
#
# Do not point `resolver` at kube-dns.kube-system.svc.cluster.local. nginx does not
# apply /etc/resolv.conf search domains, and on EKS with NodeLocal DNSCache the
# kube-dns ClusterIP is often unreachable from the pod (queries time out).
# Confirmed live, 2026-10-13 on cryo-web-12: SPA loaded, GET /api/v1/auth/config
# returned 502, error log "cryo-api could not be resolved (3: Host not found)".
# wget to http://cryo-api:8000 from the same pod succeeded because glibc uses
# search domains. `resolver local=on` is not accepted by nginx-unprivileged
# 1.30.x (it treats "local=on" as a hostname). Use the image's
# NGINX_LOCAL_RESOLVERS (pod nameserver, typically 169.254.20.10) and an FQDN
# in $cryo_api_upstream so the lookup does not need search domains.
#
# ${NGINX_LOCAL_RESOLVERS} and ${CRYO_API_UPSTREAM} are substituted at container
# start by nginx-unprivileged's envsubst entrypoint. Helm sets CRYO_API_UPSTREAM
# to the API Service FQDN; the Dockerfile default is http://cryo-api:8000.
#
# Only WebSocket upgrades (live run events) are forwarded; passing $http_upgrade verbatim
# would also tunnel `Upgrade: h2c` past the proxy (H2C request smuggling).
map $http_upgrade $cryo_upgrade {
    ~*^websocket$ websocket;
    default "";
}

map $cryo_upgrade $cryo_connection {
    websocket upgrade;
    default "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    resolver ${NGINX_LOCAL_RESOLVERS} ipv6=off valid=10s;
    set $cryo_api_upstream ${CRYO_API_UPSTREAM};

    location /api/ {
        proxy_pass $cryo_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $cryo_upgrade;
        proxy_set_header Connection $cryo_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        proxy_pass $cryo_api_upstream/healthz;
    }

    # /metrics and /healthz/deep stay in-cluster: Prometheus and probes reach the API Service
    # directly, and the UI reads the admin-only /api/v1/ops copies.
    location = /healthz/deep {
        return 404;
    }

    location = /metrics {
        return 404;
    }

    # SPA fallback: any non-file, non-API route resolves to index.html so
    # client-side routing (react-router) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
