# Mirrors vite.config.ts's dev-server proxy: the built SPA calls relative paths
# (/api/..., /healthz, /metrics) and expects them to reach the backend from the
# same origin -- this reverse-proxies those to the cryo-api Service in-cluster.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://cryo-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        proxy_pass http://cryo-api:8000/healthz;
    }

    location = /healthz/deep {
        proxy_pass http://cryo-api:8000/healthz/deep;
    }

    location = /metrics {
        proxy_pass http://cryo-api:8000/metrics;
    }

    # SPA fallback: any non-file, non-API route resolves to index.html so
    # client-side routing (react-router) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
